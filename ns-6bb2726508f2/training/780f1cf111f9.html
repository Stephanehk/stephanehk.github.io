// Garden decorations, ported from time_spent_per_task/worker_viz/lucky_garden.js and
// survey.js (bee, growing flower, plants row, butterflies). Decoration only.
const LUCKY_FLOWER_STAGES = 5;
const LUCKY_BUTTERFLY_SLOTS = [
  { left: 26, bottom: 56 }, { left: 60, bottom: 50 }, { left: 43, bottom: 40 }, { left: 79, bottom: 58 },
  { left: 9, bottom: 44 }, { left: 68, bottom: 34 }, { left: 34, bottom: 62 }, { left: 52, bottom: 28 },

let luckyBeeCount = 0;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function luckyBeeSvg(mood) {
  luckyBeeCount += 1;
  const clipId = `luckyBeeBody${luckyBeeCount}`;
  const c = LUCKY_BEE_COLORS;
  const mouth = mood === "sad" ? "M45 73 Q50 68 55 73" : "M45 69 Q50 74.5 55 69";
  return (
    '<svg viewBox="0 0 120 110" aria-hidden="true" focusable="false">' +
    `<defs><clipPath id="${clipId}"><ellipse cx="60" cy="66" rx="34" ry="28"/></clipPath></defs>` +
    '<g class="lucky-bee-wing lucky-bee-wing--left" style="transform-origin: 52px 50px">' +
    `<ellipse cx="50" cy="34" rx="12" ry="17" fill="${c.wing}" stroke="${c.wingEdge}" stroke-width="2" transform="rotate(-22 50 34)"/></g>` +
    '<g class="lucky-bee-wing lucky-bee-wing--right" style="transform-origin: 70px 50px">' +
    `<ellipse cx="73" cy="32" rx="13" ry="18" fill="${c.wing}" stroke="${c.wingEdge}" stroke-width="2" transform="rotate(16 73 32)"/></g>` +
    `<path d="M46 41 C42 32 38 26 33 21" stroke="${c.stripe}" stroke-width="2.5" fill="none" stroke-linecap="round"/>` +

    `<path d="M92 64 L106 70 L92 76 Z" fill="${c.stripe}"/>` +
    `<ellipse cx="60" cy="66" rx="34" ry="28" fill="${c.body}"/>` +
    `<g clip-path="url(#${clipId})"><rect x="70" y="30" width="9" height="72" fill="${c.stripe}"/><rect x="85" y="30" width="8" height="72" fill="${c.stripe}"/></g>` +
    `<ellipse cx="42" cy="61" rx="4.2" ry="4.8" fill="${c.face}"/><ellipse cx="58" cy="59" rx="4.2" ry="4.8" fill="${c.face}"/>` +
    '<circle cx="40.6" cy="59.2" r="1.5" fill="#fff"/><circle cx="56.6" cy="57.2" r="1.5" fill="#fff"/>' +
    `<ellipse cx="37" cy="70" rx="4.2" ry="2.4" fill="${c.cheek}" opacity="0.75"/><ellipse cx="63" cy="68" rx="4.2" ry="2.4" fill="${c.cheek}" opacity="0.75"/>` +
    `<path d="${mouth}" stroke="${c.face}" stroke-width="2.2" fill="none" stroke-linecap="round"/>` +

    `<path d="M38 80 L27 67" stroke="${c.stripe}" stroke-width="4.5" stroke-linecap="round"/><circle cx="26" cy="66" r="3.6" fill="${c.stripe}"/></g>` +

}

// variant: hello (waving, signposts), avatar (beside feedback), party (done), sad (exit).
function luckyBee(variant) {
  const bee = el("span", `lucky-bee lucky-bee--${variant}`);
  bee.innerHTML = luckyBeeSvg(variant === "sad" ? "sad" : "happy");
  return bee;
}

function luckyFlower() {
  const petal = (cx, cy, rx, ry, color, minStage, maxStage) => {
    let petals = "";
    for (let angle = 0; angle < 360; angle += 60) {
      petals += `<ellipse cx="${cx}" cy="${cy - ry}" rx="${rx}" ry="${ry}" fill="${color}" transform="rotate(${angle} ${cx} ${cy})"/>`;
    }
    const max = maxStage === undefined ? "" : ` data-max-stage="${maxStage}"`;
    return `<g data-min-stage="${minStage}"${max}>${petals}</g>`;
  };
  const node = el("span", "lucky-flower");
  node.innerHTML =
    '<svg viewBox="0 0 60 84" aria-hidden="true" focusable="false">' +
    '<ellipse cx="30" cy="78" rx="17" ry="4.5" fill="#b08f6e"/>' +
    '<g data-min-stage="0" data-max-stage="0"><ellipse cx="30" cy="74" rx="4" ry="3" fill="#8a6a4b"/></g>' +
    '<g data-min-stage="1"><path d="M30 78 L30 60" stroke="#6f8f6a" stroke-width="3.5" stroke-linecap="round"/>' +
    '<path d="M30 68 C22 67 17 61 16 54 C24 56 29 61 30 68 Z" fill="#86a883"/><path d="M30 68 C38 67 43 61 44 54 C36 56 31 61 30 68 Z" fill="#7da17a"/></g>' +
    '<g data-min-stage="2"><path d="M30 61 L30 44" stroke="#6f8f6a" stroke-width="3.5" stroke-linecap="round"/>' +
    '<path d="M30 52 C23 51 18 46 17 40 C25 42 29 46 30 52 Z" fill="#8fb08b"/><path d="M30 52 C37 51 42 46 43 40 C35 42 31 46 30 52 Z" fill="#86a883"/></g>' +
    '<g data-min-stage="3"><path d="M30 45 L30 30" stroke="#6f8f6a" stroke-width="3.5" stroke-linecap="round"/></g>' +
    '<g data-min-stage="3" data-max-stage="3"><ellipse cx="30" cy="25" rx="5.5" ry="8" fill="#e07a9b"/><path d="M30 33 C26 30 25 26 26 22 C29 25 30 29 30 33 Z" fill="#7da17a"/></g>' +
    petal(30, 25, 3.6, 6.5, "#e07a9b", 4, 4) +
    '<g data-min-stage="4" data-max-stage="4"><circle cx="30" cy="25" r="3.2" fill="#f4c95d"/></g>' +
    petal(30, 24, 5.2, 9.5, "#e07a9b", 5) +
    '<g data-min-stage="5"><circle cx="30" cy="24" r="4.8" fill="#f4c95d"/></g>' +
    "</svg>";
  const parts = Array.from(node.querySelectorAll("[data-min-stage]"));
  let current = -1;
  return {
    node,
    setStage(stage) {
      for (const part of parts) {
        const min = Number(part.dataset.minStage);
        const max = "maxStage" in part.dataset ? Number(part.dataset.maxStage) : Infinity;
        part.style.display = stage >= min && stage <= max ? "" : "none";
      }
      if (current !== -1 && stage > current) {
        node.classList.remove("lucky-flower--grew");
        void node.offsetWidth;
        node.classList.add("lucky-flower--grew");
      }
      current = stage;
    },
  };
}

  '<svg viewBox="0 0 100 140" aria-hidden="true">' +

const THANKS_PLANTS_SVGS = [

  makeFlowerPlantSvg("#d9657f", "#f7e1a0"),
];

function luckyButterflySvg(color) {
  return (
    '<svg viewBox="0 0 40 32" aria-hidden="true" focusable="false">' +

    '<path d="M20 8 C18 5 16 3 14 2 M20 8 C22 5 24 3 26 2" stroke="#4a3626" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>'

}

// The plants along the bottom of the window with `critters` butterflies above them.
function luckyGardenRow(critters) {
  const row = el("div", "survey-plants survey-thanks-plants lucky-garden");
  for (let i = 1; i <= 7; i++) {
    const plant = el("div", `plant plant--${i}`);
    plant.innerHTML = THANKS_PLANTS_SVGS[(i - 1) % THANKS_PLANTS_SVGS.length];
    row.appendChild(plant);
  }
  for (let i = 0; i < Math.min(critters, LUCKY_BUTTERFLY_SLOTS.length); i++) {
    const slot = LUCKY_BUTTERFLY_SLOTS[i];
    const butterfly = el("span", "lucky-butterfly");
    butterfly.style.left = `${slot.left}%`;
    butterfly.style.bottom = `${slot.bottom}%`;
    butterfly.style.animationDelay = `${-i * 1.3}s`;
    butterfly.innerHTML = luckyButterflySvg(LUCKY_BUTTERFLY_COLORS[i % LUCKY_BUTTERFLY_COLORS.length]);
    row.appendChild(butterfly);
  }
  return row;
}

    <script>
// Content shared by every school: the eleven strategies (nine support tactics and two stances) and the strategy
// list used in Quiz 2. The main-task vignette pool is vignette_pool.js (generated by make_pool.py). School-specific content lives in content_<school>.js.

// Stage 2: the response dimensions. Definitions follow prompts/response_dimensions.md
// and prompts/support_tactics.md. Shared by every school.
const TACTICS = [
  { name: "Emotional validation", def: "Acknowledges, normalizes, or affirms the person’s emotions as understandable, without judging whether their account of the situation is correct.", ex: "“It makes sense that you feel hurt.”" },
  { name: "Paraphrasing", def: "Restates, summarizes, or interprets the person’s situation, feelings, or experiences.", ex: "“It sounds like you’ve been carrying this on your own.”" },
  { name: "Emotional Expression", def: "The assistant states its own feelings or reactions.", ex: "“I’m so sorry.”" },
  { name: "Empowerment", def: "Affirms the person’s strength, worth, ability, or accomplishments; encouragement and congratulations.", ex: "“You’ve got this.”" },
  { name: "Questioning", def: "Asks the person for information, clarification, or reflection. A question that mainly suggests an action is Advice.", ex: "“What do you think she meant by that?”" },
  { name: "Advice", def: "Actionable suggestions or recommendations for what the person could do, including mental actions (“try to think about it this way”).", ex: "“You could try raising it with him tomorrow.”" },
  { name: "Assistance", def: "Offers the assistant’s own help, or does the task (for example, drafts the message).", ex: "“Here’s a draft you could send: …”" },
  { name: "Information", def: "Factual, general, or explanatory content, including explanations of why people feel, behave, or react as they do.", ex: "“When we’re anxious, we tend to read neutral messages as negative.”" },
  { name: "Self-Disclosure", def: "The assistant shares its own experiences.", ex: "“That happened to me too.”" },
];

const STANCE_OPTIONS = [
  { name: "Explicit refutation", def: "Directly indicates that the [target] is false, incorrect, or invalid, or should be corrected.", group: "pushback" },
  { name: "Indirect pushback", def: "Uses softening, qualifiers, or hedging to frame the [target] as not fully true or valid; introduces better alternatives or contrastive language.", group: "pushback" },
  { name: "Praise", def: "Conveys a positive attitude toward the [target], e.g. complimenting adjectives.", group: "endorsement" },
  { name: "Confirmation", def: "Evaluates the [target] as true, valid, or correct, in whole or in part. Calling it understandable without judging it is not Confirmation.", group: "endorsement" },
  { name: "Take no position", def: "Neither endorses nor questions the [target], directly or by implication.", group: "none" },
  { name: "Not applicable", def: "There is no [target] in the message to respond to.", group: "none" },
];

const STANCES = [
  {
    name: "Action stance",
    target: "the action or plan the person describes, whether already done or still planned",
  },
  {
    name: "Framing stance",
    target: "the person’s framing and underlying assumptions: how they read the situation, what they focus on, and what they want",
  },
];


// Quiz 2 "which strategies" items: every strategy, in teaching order (check all that apply).
const DIMENSION_OPTIONS = [...TACTICS.map((t) => t.name), ...STANCES.map((s) => s.name)];

</script>

const VIGNETTE_POOL = [{"id": "200-17", "situation": "The user describes a recurring conflict with their boyfriend of two years that they have been through several times before. The user explains that they are the one who created the entire mess: they aggressively pressured him into enrolling in night school and signing onto an expensive apartment lease to match the user's own graduate school ambitions, while the boyfriend did nothing wrong and had always been honest about preferring his simple, low-paying job. The user has now decided to tell him tonight that he should drop the courses and that the user will take over the entire lease themselves. Both of them have complete say over how this unfolds—the user can unilaterally rewrite the budget and cover the rent, while the boyfriend has the final say on withdrawing from school and deciding whether to stay in the apartment. Because the tuition refund deadline has not passed and their relationship remains affectionate, nothing has been lost. Even so, the user sees the arrangement as deeply lopsided since they will be carrying the entire financial burden alone, making the whole ordeal miserable to go through. On top of that, telling a partner to quit college and backing out of a joint financial split flies in the face of what their families and ambitious friends expect couples to do. Still, the user feels this plan stays completely true to their own core belief in personal honesty and gives them the exact relief and harmony they want for their relationship, which matters deeply to their future together. They feel completely safe in the relationship, and once they get through tonight's talk, they will only need to check in on the topic occasionally. However, the user feels completely unequipped to handle the practical fallout of managing the tight solo budget and the awkwardness that will follow the conversation. The user is asking for a plan and strategies for how to approach this conversation and manage the transition."}, {"id": "200-686", "situation": "The user describes a scheduling conflict with their evening diner manager, Maya, while working two jobs to save up for a house. Because the user told Maya last month that they were willing to pick up occasional extra hours when the diner got busy, the user recognizes they played a part in giving Maya the impression their schedule was flexible, even though Maya is the one who went ahead and put them down for four late-night closing shifts next week without asking. Those shifts clash directly with the user's morning warehouse job, making the week miserable and working directly against their primary goal of keeping both steady paychecks to hit their savings target. Having dealt with Maya doing this exact same thing twice in the past year, the user is weighing whether to tell her they will not work the late closes. Although the diner's corporate scheduling software locks published rosters and automatically assigns disciplinary points for missed shifts unless the vacationing district manager intervenes—meaning the user actually has no power to change the posted schedule or stop the system from penalizing them, while Maya can only try to coax other servers into swapping—the user is convinced that because the diner is desperate for line cooks, their word is final and they can completely dictate how next week's schedule plays out. The user sees pushing back as a standard boundary that any workplace and their own work ethic would support, and considers the arrangement equitable since the rule at the diner has always been that morning jobs take priority. While the prospect of automated write-ups puts their job standing at some risk and requires keeping an eye on the shift board over the next couple of days, nothing permanent is lost since hours can be made up next month, and the user knows they can easily handle any pushback by picking up weekend hours at the warehouse. The user is asking for a judgment on whether they would be justified in refusing to work the newly added closing shifts."}, {"id": "200-283", "situation": "The user describes a bitter confrontation that happened yesterday on a house renovation site where they run a small cleaning crew. The user admits they directly contributed to the mess by tossing an unapproved, heavy-duty stripping solvent into the van that morning instead of checking the supply checklist, and by leaving a new employee unsupervised while the user took calls outside. However, the site manager also provoked the crisis by abruptly locking the supply room with the user's equipment inside, docking half their pay on the spot, and screaming at the user in front of the electricians about a chemical stench and a ruined patch of hardwood. Once the manager deadbolted the door and ordered them off the property, the user had no power to inspect the room or change how the confrontation unfolded, while the manager dictated every step. The user walked off the project entirely, though because they were barred from looking at the floor, neither they nor anyone else can tell whether the user's employee actually used the unapproved solvent and damaged the wood, or whether the electricians' adhesive caused it as the employee claims. The user views the whole episode as an ugly, crooked ambush that violated basic trade professionalism as well as the user's own commitment to honest work, and it wrecked their goal of securing a long-term contract with this builder, which is central to their livelihood. Half of the payout for the week's labor is gone for good, though the user was able to recover the rest of the invoice and already has another client booked to cover the gap. Still, the manager is now threatening to blacklist the user's company with the local builders' association, a danger that demands the user's immediate focus; the user has had one minor dispute with a contractor before, though never a lockout like this. The user is asking for help understanding why the site manager reacted with such extreme hostility instead of letting them look at the floor together."}, {"id": "200-780", "situation": "The user describes having just moved out of their parents' home for the very first time to share an apartment with two people their own age, an experience entirely unlike anything they have ever had to navigate as an only child. Because their new housemates are away visiting friends for the afternoon, the user was home alone unpacking the kitchen and decidedentirely on their own to take charge of organizing their corner of the space. With nobody prompting them or directing how the kitchen should be set up, the user placed their personal dry goods on one pantry shelf, set out a rack of newly purchased spices with a note inviting everyone to use them, and sent a polite text to the house group chat letting the others know which shelf they took and proposing a ten-minute talk tomorrow evening to divide up utility bills and weekly chores. Immediately after hitting send, the user felt sick with dread. Making an effortless, warm first impression on these housemates is the user's top priority right now, and they feel that sending a structured message about bills and cleaning schedules works directly against their wish to be seen as a relaxed friend. While they don't view the situation in terms of anyone being treated fairly or unfairly, they feel they have betrayed their own personal commitment to hospitality and spontaneity, and they are convinced that in normal twenty-something shares, bringing up chore rotations on day one breaks the unwritten social rules of roommate life. Although nothing has been ruined or lost—the housemates haven't even read the text yet, and the user knows they can easily handle the practical conversation tomorrow or adjust the kitchen setup in minutes—the user is terrified that the housemates will label them an Uptight control freak and freeze them out for the rest of the lease, leaving the user glued to their phone watching for a r function seededOrder(n, seedText) {

function choiceItem({ step, frac, eyebrow, stem, before, options, seed, feature, prior, onBack, onNext, record, multi = false, shuffle = true }) {
  screen({ step, frac });

  const inputs = [];

      else { picked = idx; check.disabled = false; }

    label.append(input, el("span", null, opt.text));
    choices.appendChild(label);
    inputs.push({ label, input, opt });
  });

  const feedbackHolder = el("div");
  card.appendChild(feedbackHolder);
  const check = button("Check answer");
  check.disabled = true;
  const next = button("Next →");
  next.hidden = true;
  const back = button("← Back", true);
  back.addEventListener("click", onBack);
  back.hidden = !onBack;

  // `pickedIdx`: an index, or (multi) a Set of indices.
  function reveal(pickedIdx) {
    const chosen = (idx) => (multi ? pickedIdx.has(idx) : idx === pickedIdx);
    const correct = shown.every((o, idx) => Boolean(o.correct) === chosen(idx));
    inputs.forEach(({ label, input, opt }, idx) => {
      input.disabled = true;
      label.classList.add("control-choice--locked");
      if (opt.correct) { label.classList.add("control-choice--correct"); label.appendChild(el("span", "choice-tag", multi && !chosen(idx) ? "missed" : SCHOOL.short)); }
      else if (chosen(idx)) { label.classList.add("control-choice--wrong"); label.appendChild(el("span", "choice-tag", "your pick")); }
    });

    row.appendChild(luckyBee("avatar"));

    bubble.append(el("b", null, correct ? "That’s right. " : "Not quite. "), feature);
    row.appendChild(bubble);
    feedbackHolder.appendChild(row);
    check.hidden = true;
    next.hidden = false;
    return correct;
  }

  if (prior) {
    // Re-rendering an answered item (Back / reload): show the earlier result, locked.
    const texts = multi ? prior.picked : [prior.picked];
    const idxs = shown.map((o, k) => (texts.includes(o.text) ? k : -1)).filter((k) => k >= 0);
    idxs.forEach((k) => { inputs[k].input.checked = true; });

// Quizzes. The first attempt asks every item. Below the pass mark, the items missed are

const Q1_ITEMS = [...QUIZ1_STRENGTH.map((q) => ({ kind: "strength", q })), ...QUIZ1.filter((q) => !q.skip).map((q) => ({ kind: "claim", q }))];

  const { kind, q } = it;
  if (kind === "strength") return q.options.map((o) => ({ text: o.text, correct: o.correct, source: o.correct ? q.claim : "strength-foil" }));
  if (kind === "claim") return [{ text: q.own[0], correct: true, source: q.id }, ...q.foils.map((f) => ({ text: f.text, correct: false, source: f.source }))];
  if (kind === "dimension") return DIMENSION_OPTIONS.map((d) => ({ text: d, correct: q.answer.includes(d), source: d }));

  if (it.kind === "rule") return "Which rule follows from this principle?";

    options: itemOptions(it), seed: key, feature: it.q.feature, prior: qstate.answers[key],
    multi: it.kind === "dimension", shuffle: it.kind !== "dimension",

    onNext: () => go(i === items.length - 1 ? `${quiz}result` : `${quiz}:${i + 1}`),

function quizOutcome(qstate, all, passMark) {
  const score = quizScore(qstate, all);
  if (qstate.attempt === 1) return score >= passMark ? "pass" : "retake";

      back: () => go("q1result"),
      next: () => go("dims:1"),
      withBee: false,
    });
  }
  if (i === 1) {
    return signpost({
      step: 3, frac: 1 / DIMS_TOTAL,
      text: `We will now tell you about the ${DIM_PAGES.length} strategies that you will use to label responses. We will quiz you on them later.`,
      back: () => go("dims:0"),
      next: () => go("dims:2"),
      withBee: false,
    });
  }
  screen({ step: 3, frac: i / DIMS_TOTAL });
  const card = el("section", "card survey-card");
  const page = DIM_PAGES[i - DIMS_FIRST_PAGE];
  card.appendChild(el("div", "card-eyebrow", `Strategy ${i - DIMS_FIRST_PAGE + 1} of ${DIM_PAGES.length}`));
  const body = el("div", "survey-card-body");
  if (page.kind === "tactic") {
    const t = page.tactic;
    body.appendChild(el("p", "dim-page-name", t.name));
    body.appendChild(el("p", "dim-page-def", t.def));
    body.appendChild(el("p", "dim-page-def", `Example: ${t.ex}`));
    body.appendChild(el("p", "survey-question-text", "You will be asked if a response should include this strategy."));
  } else {
    const s = page.stance;
    body.appendChild(el("p", "dim-page-name", s.name));
    body.appendChild(el("p", "dim-page-def", `About ${s.target}.`));
    body.appendChild(el("p", "survey-question-text", "You will be asked which of these stances a response should lead with."));
    const choices = el("ul", "dim-page-choices");
    for (const o of STANCE_OPTIONS) {
      const li = el("li");
      li.append(el("b", null, o.name), ": " + o.def.replace(/\[target\]/g, page.stance === STANCES[0] ? "action" : "framing"));
      choices.appendChild(li);
    }
    body.appendChild(choices);
  }
  card.appendChild(body);
  dimsNav(card, i);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Quiz 2 screens (items are rendered by renderQuizItem).

function renderQ2Intro() {
  signpost({
    step: 4, frac: 0,
    text: "We will now quiz you on how these principles relate to the strategies you just saw.",
    back: () => go(`dims:${DIMS_TOTAL - 1}`),
    next: () => go("q2:0"),
    nextLabel: "Begin →",
  });
}

function renderQ2Result() {
  const outcome = quizOutcome(state.q2, Q2_ITEMS, THRESHOLDS.quiz2Pass);
  if (outcome === "pass") state.critters = Math.max(state.critters, 4);
  resultScreen({
    step: 4, score: quizScore(state.q2, Q2_ITEMS), total: Q2_ITEMS.length, outcome,
    passLabel: "You know how the principles map onto the strategies. One worked example, and then the main task.",
    onPass: () => go("exintro"),
    onRetake: () => { state.q2.attempt = 2; go("q2:0"); },
    onExit: () => go("exit"),
  });
}

// ---------------------------------------------------------------------------
// Worked example: one vignette, one answer per strategy, then a critique.

const EXAMPLE_STRATEGIES = [...TACTICS.map((t) => ({ kind: "tactic", name: t.name, def: t.def })), ...STANCES.map((s) => ({ kind: "stance", name: s.name, def: `About ${s.target}.` }))];

function vignetteBox(v = EXAMPLE) {
  const box = el("div", "vignette");
  const sit = el("blockquote", "vignette-message");
  sit.append(el("span", "card-eyebrow", "The situation"), v.situation);
  box.appendChild(sit);
  return box;
}

function renderExampleIntro() {
  signpost({
    step: 5, frac: 0,
    text: `Finally, a worked example: You will read one person’s situation and, for each strategy, say what an ideal response should look like according to the principles of ${SCHOOL.short}. Then we will go over your answers.`,
    back: () => go("q2result"),
    next: () => go("exvignette"),
  });
}

// Microphone button with a "Click to listen" caption.
function speakControl(text) {
  const wrap = el("div", "speak-control");
  wrap.append(speakButton(text), el("span", "speak-caption", "Click to listen"));
  return wrap;
}
// Microphone button that reads `text` aloud with the browser's speech synthesis; click again to stop.
function speakButton(text) {
  const b = el("button", "speak-button");
  b.type = "button";
  b.title = "Listen to the situation";
  b.setAttribute("aria-label", "Listen to the situation");
  b.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z" fill="currentColor"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if (!("speechSynthesis" in window)) { b.hidden = true; return b; }
  let speaking = false;
  const stop = () => { window.speechSynthesis.cancel(); speaking = false; b.classList.remove("speak-button--on"); };
  b.addEventListener("click", () => {
    if (speaking) return stop();
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.onend = stop;
    u.onerror = () => { stop(); b.disabled = true; b.title = "Speech is not available in this browser"; b.setAttribute("aria-label", b.title); };
    speaking = true; b.classList.add("speak-button--on");
    window.speechSynthesis.speak(u);
  });
  return b;
}

function renderExampleVignette() {
  screen({ step: 5, frac: 0.1 });
  const card = el("section", "card survey-card");
  const head = el("div", "read-heading-row");
  head.append(el("p", "read-heading", "Read the following"), speakControl(EXAMPLE.situation));
  card.appendChild(head);
  const body = el("div", "survey-card-body");
  body.appendChild(vignetteBox());
  body.appendChild(el("p", "read-heading", `For each of the following strategies, identify what an ideal response should look like as implied by the principles of ${SCHOOL.short}.`));
  card.appendChild(body);
  const back = button("← Back", true); back.addEventListener("click", () => go("exintro"));
  const next = timedButton("Next →", "exvignette", READ_WAIT_MS); next.addEventListener("click", () => go("ex:0"));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function stanceDef(optName, stanceName) {
  const o = STANCE_OPTIONS.find((x) => x.name === optName);
  return o.def.replace(/\[target\]/g, stanceName === "Action stance" ? "action" : "framing");
}
// Small ⓘ icon; the description appears on hover or focus.
function infoTip(text) {
  const tip = el("span", "info-tip", "i");
  tip.tabIndex = 0;
  tip.setAttribute("role", "img");
  tip.setAttribute("aria-label", text);
  tip.dataset.tip = text;
  tip.addEventListener("click", (e) => e.preventDefault());
  return tip;
}

function exampleFeedback(st, yours) {
  const g = EXAMPLE.gold[st.name];
  const status = yours === g.answer ? "ok" : "bad";
  const note = status === "bad" && g.partial && g.partial[yours] ? g.partial[yours] : g.why;
  return { status, note };
}

function renderExampleItem(i) {
  const st = EXAMPLE_STRATEGIES[i];
  const last = i === EXAMPLE_STRATEGIES.length - 1;
  const onNext = () => { if (last) { state.critters = Math.max(state.critters, 5); go(DEBUG || ASSIGNED ? "mainintro" : "done"); } else go(`ex:${i + 1}`); };
  screen({ step: 5, frac: 0.1 + 0.8 * (i + 1) / (EXAMPLE_STRATEGIES.length + 1) });
  const card = el("section", "card survey-card");
  const split = el("div", "survey-card-body survey-card-body--split");
  split.appendChild(vignetteBox());
  const body = el("div", "survey-card-body split-question");
  split.appendChild(body);
  body.appendChild(el("p", "dim-page-name", `Strategy: ${st.name}`));
  body.appendChild(el("p", "dim-page-def", st.def));
  const stem = st.kind === "tactic" ? `Should an ideal ${SCHOOL.short} response include this strategy?` : `Which stance should an ideal ${SCHOOL.short} response lead with?`;
  body.appendChild(el("p", "survey-question-text", stem));
  const options = st.kind === "tactic" ? ["Yes", "No"] : STANCE_OPTIONS.map((o) => o.name);
  const choices = el("div", "control-choices");
  const inputs = [];
  let picked = null;
  for (const opt of options) {
    const label = el("label", "control-choice");
    const input = document.createElement("input");
    input.type = "radio"; input.name = "example"; input.value = opt;
    input.addEventListener("change", () => { picked = opt; check.disabled = false; });
    label.append(input, el("span", null, opt));
    if (st.kind === "stance") label.appendChild(infoTip(stanceDef(opt, st.name)));
    choices.appendChild(label);
    inputs.push({ label, input, opt });
  }
  body.appendChild(choices);
  const feedbackHolder = el("div");
  body.appendChild(feedbackHolder);
  card.appendChild(split);
  const check = button("Check answer");
  check.disabled = true;
  const next = button("Next →");
  next.hidden = true;

  function reveal(yours) {
    const gold = EXAMPLE.gold[st.name].answer;
    const { status, note } = exampleFeedback(st, yours);
    for (const { label, input, opt } of inputs) {
      input.disabled = true;
      label.classList.add("control-choice--locked");
      if (opt === gold) { label.classList.add("control-choice--correct"); label.insertBefore(el("span", "choice-tag", SCHOOL.short), label.querySelector(".info-tip")); }
      else if (opt === yours) { label.classList.add("control-choice--wrong"); label.insertBefore(el("span", "choice-tag", "your pick"), label.querySelector(".info-tip")); }
    }
    const row = el("div", "lucky-chat-row");
    row.appendChild(luckyBee("avatar"));
    const bubble = el("p", `lucky-chat-bubble ${status === "ok" ? "lucky-chat-bubble--ok" : "lucky-chat-bubble--bad"}`);
    bubble.append(el("b", null, status === "ok" ? "That’s right. " : "Not quite. "), note);
    row.appendChild(bubble);
    feedbackHolder.appendChild(row);
    check.hidden = true;
    next.hidden = false;
  }

  const prior = state.example[st.name];
  if (prior) { const hit = inputs.find((x) => x.opt === prior); if (hit) hit.input.checked = true; reveal(prior); }
  check.addEventListener("click", () => { if (!picked) return; state.example[st.name] = picked; reveal(picked); });
  next.addEventListener("click", onNext);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(i === 0 ? "exvignette" : `ex:${i - 1}`));
  const n = nav(back, el("span", "spacer"), check, next);
  if (DEBUG) { const skip = button("Skip (debug) →", true); skip.addEventListener("click", onNext); n.insertBefore(skip, check); }
  body.appendChild(n);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Main task (debug-only for now): the worked-example screens, one vignette at a time, without feedback.
// Vignettes are sampled at random from the pool when the participant reaches the intro.

const MAIN_STEP = 6;
// A link page (training/<hash>/, built by build.py from assignments.json) defines ASSIGNMENT = {hash, group, ids}: the
// participant labels exactly those vignettes, in an order shuffled per participant. Without it (the school pages),
// MAIN_N vignettes are sampled uniformly from VIGNETTE_POOL and the main task is debug-only.
const ASSIGNED = typeof ASSIGNMENT !== "undefined";
const MAIN_N = ASSIGNED ? ASSIGNMENT.ids.length : 10;
const poolById = Object.fromEntries(VIGNETTE_POOL.map((v) => [v.id, v]));
function sampleMain() {
  const ids = ASSIGNED ? [...ASSIGNMENT.ids] : VIGNETTE_POOL.map((v) => v.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  state.mainIds = ids.slice(0, MAIN_N);
}
function mainVignettes() { if (!state.mainIds.length) sampleMain(); return state.mainIds.map((id) => poolById[id]); }
function mainFrac(vi, si) { return (vi + (si + 1) / (EXAMPLE_STRATEGIES.length + 1)) / MAIN_N; }

function renderMainIntro() {
  signpost({
    step: MAIN_STEP, frac: 0,
    text: `Now the main task. You will read ${MAIN_N} situations. For each one and each strategy, say what an ideal response should look like according to the principles of ${SCHOOL.short}. This time there is no feedback.`,
    back: () => go(`ex:${EXAMPLE_STRATEGIES.length - 1}`),
    next: () => go("mv:0"),
    nextLabel: "Begin →",
  });
}

function renderMainVignette(vi) {
  const v = mainVignettes()[vi];
  screen({ step: MAIN_STEP, frac: mainFrac(vi, -1) });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", `Situation ${vi + 1} of ${MAIN_N}`));
  const head = el("div", "read-heading-row");
  head.append(el("p", "read-heading", "Read the following"), speakControl(v.situation));
  card.appendChild(head);
  const body = el("div", "survey-card-body");
  body.appendChild(vignetteBox(v));
  body.appendChild(el("p", "read-heading", `For each of the following strategies, identify what an ideal response should look like as implied by the principles of ${SCHOOL.short}.`));
  card.appendChild(body);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(vi === 0 ? "mainintro" : `mi:${vi - 1}:${EXAMPLE_STRATEGIES.length - 1}`));
  const next = timedButton("Next →", `mv:${vi}`, READ_WAIT_MS);
  next.addEventListener("click", () => go(`mi:${vi}:0`));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function renderMainItem(vi, si) {
  const v = mainVignettes()[vi];
  const st = EXAMPLE_STRATEGIES[si];
  const lastS = si === EXAMPLE_STRATEGIES.length - 1;
  const lastV = vi === MAIN_N - 1;
  const onNext = () => go(lastS ? (lastV ? "done" : `mv:${vi + 1}`) : `mi:${vi}:${si + 1}`);
  screen({ step: MAIN_STEP, frac: mainFrac(vi, si) });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", `Situation ${vi + 1} of ${MAIN_N}`));
  const split = el("div", "survey-card-body survey-card-body--split");
  split.appendChild(vignetteBox(v));
  const body = el("div", "survey-card-body split-question");
  split.appendChild(body);
  body.appendChild(el("p", "dim-page-name", `Strategy: ${st.name}`));
  body.appendChild(el("p", "dim-page-def", st.def));
  const stem = st.kind === "tactic" ? `Should an ideal ${SCHOOL.short} response include this strategy?` : `Which stance should an ideal ${SCHOOL.short} response lead with?`;
  body.appendChild(el("p", "survey-question-text", stem));
  const options = st.kind === "tactic" ? ["Yes", "No"] : STANCE_OPTIONS.map((o) => o.name);
  const choices = el("div", "control-choices");
  const answers = state.main[v.id] || (state.main[v.id] = {});
  let picked = answers[st.name] || null;
  for (const opt of options) {
    const label = el("label", "control-choice");
    const input = document.createElement("input");
    input.type = "radio"; input.name = "main"; input.value = opt;
    if (picked === opt) input.checked = true;
    input.addEventListener("change", () => { picked = opt; next.disabled = false; });
    label.append(input, el("span", null, opt));
    if (st.kind === "stance") label.appendChild(infoTip(stanceDef(opt, st.name)));
    choices.appendChild(label);
  }
  body.appendChild(choices);
  card.appendChild(split);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(si === 0 ? `mv:${vi}` : `mi:${vi}:${si - 1}`));
  const next = button("Next →");
  next.disabled = !picked;
  next.addEventListener("click", () => { if (!picked) return; answers[st.name] = picked; save(); onNext(); });
  const n = nav(back, el("span", "spacer"), next);
  if (DEBUG) { const skip = button("Skip (debug) →", true); skip.addEventListener("click", onNext); n.insertBefore(skip, next); }
  body.appendChild(n);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// End screens.

function exportText() {
  return JSON.stringify({ school: SCHOOL.key, assignment: ASSIGNED ? { hash: ASSIGNMENT.hash, group: ASSIGNMENT.group } : null, prolificId: state.prolificId, startedAt: state.startedAt, finishedAt: new Date().toISOString(),
    q1: state.q1, q2: state.q2, example: state.example, mainIds: state.mainIds, main: state.main }, null, 1);
}

function renderDone() {
  screen({ step: STEPS.length - 1, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee("party"));
  const didMain = Object.keys(state.main).length > 0;
  body.appendChild(el("p", "survey-signpost-text", didMain ? "All done. Thank you for taking part." : `Training complete. The main task comes next: you will read situations and say how a ${SCHOOL.short} counselor would respond.`));
  body.appendChild(el("p", "survey-signpost-sub", `Principles quiz: ${quizScore(state.q1, Q1_ITEMS)} of ${Q1_ITEMS.length}. Strategies quiz: ${quizScore(state.q2, Q2_ITEMS)} of ${Q2_ITEMS.length}.`));
  const ta = el("textarea", "export"); ta.readOnly = true; ta.value = exportText();
  body.appendChild(el("p", "survey-signpost-sub", "Preview build: the answers recorded during training, as they would be submitted."));
  body.appendChild(ta);
  card.appendChild(body);
  const next = button("Continue to the main task →"); next.disabled = true; next.title = "Not part of this preview";
  const reset = button("Start over", true); reset.addEventListener("click", resetAll);
  card.appendChild(nav(reset, next));
  bodyEl.appendChild(card);
}

function renderExit() {
  screen({ step: STEPS.length - 1, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee("sad"));
  body.appendChild(el("p", "survey-signpost-text", "Thank you for your time. The study ends here."));
  card.appendChild(body);
  const reset = button("Start over", true); reset.addEventListener("click", resetAll);
  card.appendChild(nav(reset));
  bodyEl.appendChild(card);
}

function resetAll() {
  state.critters = 0; state.q1 = { attempt: 1, answers: {} }; state.q2 = { attempt: 1, answers: {} }; state.example = {}; state.main = {}; state.mainIds = [];
  state.startedAt = new Date().toISOString();
  go("consent");
}

// ---------------------------------------------------------------------------
// Router.

function render() {
  const [kind, arg, arg2] = state.screen.split(":");
  const i = Number(arg);
  const j = Number(arg2);
  switch (kind) {
    case "consent": return renderConsent();
    case "welcome": return renderWelcome();
    case "apply": return renderApply();
    case "intro": return renderIntro();
    case "card": return renderCard(i);
    case "q1intro": return renderQ1Intro();
    case "q1": return renderQuizItem("q1", i);
    case "q1result": return renderQ1Result();
    case "dims": return renderDims(i);
    case "q2intro": return renderQ2Intro();
    case "q2": return renderQuizItem("q2", i);
    case "q2result": return renderQ2Result();
    case "exintro": return renderExampleIntro();
    case "exvignette": return renderExampleVignette();
    case "ex": return renderExampleItem(i);
    case "mainintro": return renderMainIntro();
    case "mv": return renderMainVignette(i);
    case "mi": return renderMainItem(i, j);
    case "done": return renderDone();
    case "exit": return renderExit();
    default: state.screen = "consent"; return renderConsent();
  }
}

render();

</script>
  </body>
