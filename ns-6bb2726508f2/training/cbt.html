---
sitemap: false
layout: null
---
{% raw %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Counselor training</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <style>
/* Styles ported from time_spent_per_task/worker_viz (styles.css, survey.css): the
   same palette, type, cards, buttons, and the /lucky garden theme. */
:root {
  --bg: #f7f1e8;
  --surface: #fffaf2;
  --surface-strong: #ffffff;
  --ink: #221914;
  --ink-soft: #5c514b;
  --ink-faint: #8b7c73;
  --rule: #e6d8c8;
  --rule-strong: #cdbba7;
  --accent: #7a6f9f;
  --accent-dark: #5f5482;
  --accent-deep: #3a2c5c;
  --chip-bg: #f0e2d2;
  --ok: #3d7a4a;
  --ok-bg: rgba(61, 122, 74, 0.1);
  --bad: #b42318;
  --bad-bg: rgba(180, 35, 24, 0.06);
  --shadow: 0 1px 2px rgba(34, 25, 20, 0.05), 0 18px 48px rgba(77, 51, 31, 0.09);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(circle at top left, rgba(122, 111, 159, 0.16), transparent 32rem),
    radial-gradient(circle at top right, rgba(58, 44, 92, 0.10), transparent 28rem),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page { position: relative; z-index: 1; width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 44vh; }
h1, h2, h3, p { margin-top: 0; }
.hero { display: grid; gap: 10px; margin-bottom: 8px; }
.eyebrow, .card-eyebrow {
  color: var(--ink-faint); font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
}
h1 { margin-bottom: 0; font-size: clamp(22px, 2.8vw, 32px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
h1[hidden], .lede[hidden] { display: none; }
.lede { max-width: 760px; margin-bottom: 4px; color: var(--ink-soft); font-size: clamp(16px, 1.8vw, 19px); }

.card {
  border: 1px solid var(--rule); border-radius: 18px; background: rgba(255, 250, 242, 0.92); box-shadow: var(--shadow);
}
.survey-card { margin-top: 20px; padding: 30px 34px 26px; }
body:has(.lucky-garden) .survey-card { background: var(--surface); }
.card h2 { margin-bottom: 8px; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -0.025em; line-height: 1.15; }
.survey-card-body { display: grid; gap: 12px; }
.survey-card--signpost .survey-card-body { justify-items: center; padding: 28px 0; }
.survey-signpost-text {
  margin: 0; max-width: 640px; text-align: center; font-size: clamp(19px, 2.3vw, 25px);
  font-weight: 600; line-height: 1.45; color: var(--ink);
}
.survey-signpost-sub { margin: 0; max-width: 640px; text-align: center; color: var(--ink-soft); font-size: 16px; }

.submit-button {
  border: 1.5px solid var(--ink); border-radius: 999px; background: var(--surface-strong); color: var(--ink);
  cursor: pointer; font: inherit; font-weight: 700; font-size: 15px; padding: 10px 22px;
  transition: background 160ms ease, transform 80ms ease;
}
.submit-button:hover:not(:disabled) { background: #f3eadf; }
.submit-button:active:not(:disabled) { transform: translateY(1px); }
.submit-button:focus-visible:not(:disabled) { background: #f3eadf; outline: none; }
.submit-button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.submit-button--secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--rule-strong); }
.submit-button--secondary:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.lucky-nav { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.lucky-nav .spacer { flex: 1; }
.survey-warning { margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--bad); text-align: right; }
.survey-warning[hidden] { display: none; }

/* Step bar with the growing flower. */
.lucky-turns { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
.lucky-turns-bar { flex: 1 1 auto; min-width: 0; display: grid; gap: 6px; }
.step-label { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.survey-progress { width: min(420px, 100%); height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.survey-progress-fill { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 240ms ease; }
.lucky-flower { display: inline-block; flex: none; width: 44px; height: 61px; line-height: 0; transform-origin: 50% 100%; }
#flower { display: block; flex: none; line-height: 0; }
.lucky-flower--grew { animation: lucky-flower-pop 0.6s ease-out; }
@keyframes lucky-flower-pop { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* Principle cards. */
.principle-teaches { font-size: 18px; line-height: 1.5; }
.principle-quote {
  margin: 4px 0 0; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 8px;
  background: rgba(122, 111, 159, 0.08); font-size: 15.5px; line-height: 1.45; color: var(--ink);
}
.principle-quote cite { display: block; margin-top: 4px; color: var(--ink-faint); font-style: normal; font-size: 13px; }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
@media (max-width: 560px) { .rules { grid-template-columns: 1fr; } }
.rule { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); font-size: 15px; line-height: 1.4; }
.rule-label { display: block; margin-bottom: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
.rule--in .rule-label { color: var(--ok); }
.rule--out .rule-label { color: var(--bad); }
.strength { display: inline-flex; align-items: center; gap: 8px; margin-top: 2px; padding: 6px 12px; border-radius: 999px; background: var(--chip-bg); font-size: 14px; font-weight: 600; color: var(--ink-soft); }
.strength b { color: var(--ink); font-weight: 700; }

/* Checks. */
.survey-question-text { margin: 0; font-weight: 600; font-size: 18px; line-height: 1.4; }
.control-choices { display: grid; gap: 8px; margin: 12px 0 4px; }
.control-choice {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--rule-strong);
  border-radius: 10px; background: var(--surface-strong); font-size: 15px; line-height: 1.4; color: var(--ink-soft);
  cursor: pointer; transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
}
.control-choice:focus-within { border-color: var(--ink); color: var(--ink); }
.control-choice input[type="radio"] { margin: 2px 0 0; accent-color: var(--accent); width: 16px; height: 16px; flex: 0 0 auto; cursor: pointer; }
.control-choice:has(input:checked) { border-color: var(--ink); background: #f3eadf; color: var(--ink); font-weight: 600; }
.control-choice--locked { cursor: default; }
.control-choice--correct { border-color: var(--ok); background: var(--ok-bg); color: var(--ink); font-weight: 600; }
.control-choice--wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--ink); }
.control-choice--wrong input, .control-choice--correct input { accent-color: currentColor; }
.choice-tag { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.control-choice--correct .choice-tag { color: var(--ok); }
.control-choice--wrong .choice-tag { color: var(--bad); }

/* Feedback: the bee speaks. */
.lucky-chat-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 14px; }
.lucky-chat-bubble {
  padding: 12px 16px; border-radius: 16px; border: 1px solid var(--rule); background: var(--surface-strong);
  font-size: 15.5px; line-height: 1.5; animation: lucky-speech-in 0.3s ease-out both;
}
.lucky-chat-bubble b { font-weight: 700; }
.lucky-chat-bubble--ok b { color: var(--ok); }
.lucky-chat-bubble--bad b { color: var(--bad); }
@keyframes lucky-speech-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Score screens. */
.score { font-size: clamp(32px, 5vw, 48px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
.score small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-family: var(--mono); }
.review-list { width: 100%; max-width: 640px; margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; }
.review-list li { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: var(--surface-strong); border: 1px solid var(--rule); font-size: 14.5px; }
.review-list .mark { font-family: var(--mono); font-weight: 700; flex: none; }
.review-list .mark--ok { color: var(--ok); }
.review-list .mark--bad { color: var(--bad); }

/* Dimension screens. */
.dim-list { display: grid; gap: 8px; margin: 6px 0 0; }
.dim { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); }
.dim--cbt { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.dim-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.dim-name { font-weight: 700; font-size: 16px; }
.dim-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--accent-dark); background: rgba(122, 111, 159, 0.12); padding: 2px 8px; border-radius: 999px; }
.dim-def { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); line-height: 1.45; }
.dim-ex { margin: 4px 0 0; font-size: 14px; color: var(--ink); font-style: italic; }
.notes { margin: 8px 0 0; padding: 12px 16px 12px 32px; border-radius: 10px; background: var(--chip-bg); font-size: 15px; line-height: 1.5; }
.notes li + li { margin-top: 4px; }
.callout { margin: 0; padding: 14px 16px; border-left: 3px solid var(--accent); border-radius: 8px; background: rgba(122, 111, 159, 0.08); font-size: 16px; font-weight: 600; line-height: 1.4; }
.stance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 680px) { .stance-grid { grid-template-columns: 1fr; } }
.stance { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface-strong); display: grid; gap: 6px; }
.stance h3 { margin: 0; font-size: 17px; }
.stance .target { margin: 0; font-size: 14.5px; color: var(--ink-soft); }
.stance .note { margin: 0; font-size: 14.5px; }
.stance--cbt { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.option-table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 6px; }
.option-table td { padding: 8px 10px; border-top: 1px solid var(--rule); vertical-align: top; }
.option-table td:first-child { font-weight: 700; white-space: nowrap; }
.group-pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.group-pill--pushback { background: var(--bad-bg); color: var(--bad); }
.group-pill--endorsement { background: var(--ok-bg); color: var(--ok); }
.feature-list { display: grid; gap: 8px; margin-top: 4px; }
.feature { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); }
.feature .q { font-weight: 700; font-size: 16px; }
.feature .d { margin: 3px 0 0; color: var(--ink-soft); font-size: 14.5px; }
.feature .w { margin: 4px 0 0; font-size: 14px; color: var(--accent-dark); font-weight: 600; }

.principle-ref { margin: 0; padding: 12px 16px; border-radius: 10px; border: 1px dashed var(--rule-strong); background: var(--surface-strong); font-size: 15.5px; line-height: 1.45; }
.principle-ref .card-eyebrow { display: block; margin-bottom: 4px; }

.export { width: 100%; min-height: 120px; margin-top: 10px; padding: 10px; border: 1px solid var(--rule-strong); border-radius: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); background: var(--surface-strong); }
.debug-bar { position: fixed; top: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; opacity: 0.6; }
.debug-bar button { font: inherit; font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface-strong); cursor: pointer; }

/* ---------- The /lucky garden theme (bee, plants, butterflies) ---------- */
.lucky-bee { display: inline-block; line-height: 0; }
.lucky-bee svg, .lucky-flower svg, .lucky-butterfly svg { display: block; width: 100%; height: 100%; overflow: visible; }
.lucky-bee--hello { display: block; width: 112px; height: 103px; margin: 0 auto 6px; animation: lucky-bee-float 3.2s ease-in-out infinite; }
.lucky-bee--hello .lucky-bee-wing { animation: lucky-bee-flap 0.9s ease-in-out infinite alternate; }
.lucky-bee--hello .lucky-bee-arm--wave { animation: lucky-bee-wave 1.8s ease-in-out infinite; }
.lucky-bee--avatar { flex: none; width: 44px; height: 40px; }
.lucky-bee--avatar .lucky-bee-wing { animation: lucky-bee-flap 0.9s ease-in-out infinite alternate; }
.lucky-bee--party { display: block; width: 128px; height: 118px; margin: 0 auto 6px; transform-origin: 50% 100%; animation: lucky-bee-bounce 0.9s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate; }
.lucky-bee--party .lucky-bee-wing { animation: lucky-bee-flap 0.2s ease-in-out infinite alternate; }
.lucky-bee--party .lucky-bee-arm--wave { animation: lucky-bee-wave 0.9s ease-in-out infinite; }
.lucky-bee--sad { display: block; width: 112px; height: 103px; margin: 0 auto 6px; animation: lucky-bee-float 4s ease-in-out infinite; }
.lucky-bee--sad .lucky-bee-wing { animation: lucky-bee-flap 1.4s ease-in-out infinite alternate; }
@keyframes lucky-bee-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
@keyframes lucky-bee-flap { from { transform: scaleY(1); } to { transform: scaleY(0.72); } }
@keyframes lucky-bee-wave { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-34deg); } 70% { transform: rotate(12deg); } }
@keyframes lucky-bee-bounce { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-16px) rotate(6deg); } }

.survey-plants { pointer-events: none; }
.survey-thanks-plants { position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; z-index: 0; }
.survey-plants .plant { position: absolute; bottom: -8px; transform-origin: 50% 100%; transform: scaleX(var(--flip, 1)); }
.plant svg { display: block; width: 100%; height: 100%; }
.plant--1 { left: 2%; width: 33vh; height: 46vh; }
.plant--2 { left: 13%; width: 26vh; height: 36vh; --flip: -1; }
.plant--3 { left: 30%; width: 21vh; height: 30vh; }
.plant--4 { left: 52%; width: 24vh; height: 33vh; --flip: -1; }
.plant--5 { left: 70%; width: 22vh; height: 31vh; }
.plant--6 { right: 9%; width: 29vh; height: 40vh; }
.plant--7 { right: 1%; width: 36vh; height: 50vh; --flip: -1; }
.lucky-garden .lucky-butterfly { position: absolute; width: 58px; height: 46px; line-height: 0; animation: lucky-butterfly-drift 5.5s ease-in-out infinite alternate; }
.lucky-garden .lucky-butterfly-wing { animation: lucky-butterfly-flap 0.45s ease-in-out infinite alternate; }
@keyframes lucky-butterfly-flap { from { transform: scaleX(1); } to { transform: scaleX(0.4); } }
@keyframes lucky-butterfly-drift { 0% { transform: translate(0, 0) rotate(-6deg); } 50% { transform: translate(16px, -12px) rotate(5deg); } 100% { transform: translate(-8px, -22px) rotate(-3deg); } }

@media (prefers-reduced-motion: reduce) {
  .lucky-bee, .lucky-bee .lucky-bee-wing, .lucky-bee .lucky-bee-arm--wave, .lucky-flower,
  .lucky-garden .lucky-butterfly, .lucky-garden .lucky-butterfly-wing, .lucky-chat-bubble { animation: none; }
}

</style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div id="eyebrow" class="card-eyebrow" hidden></div>
        <h1 id="title" hidden></h1>
        <p id="lede" class="lede" hidden></p>
        <div class="lucky-turns">
          <div class="lucky-turns-bar">
            <div id="stepLabel" class="step-label"></div>
            <div class="survey-progress" aria-hidden="true"><span id="progressFill" class="survey-progress-fill"></span></div>
          </div>
          <span id="flower"></span>
        </div>
      </section>
      <div id="body"></div>
    </main>
    <script>
// Garden decorations, ported from time_spent_per_task/worker_viz/lucky_garden.js and
// survey.js (bee, growing flower, plants row, butterflies). Decoration only.
const LUCKY_FLOWER_STAGES = 5;
const LUCKY_BUTTERFLY_SLOTS = [
  { left: 26, bottom: 56 }, { left: 60, bottom: 50 }, { left: 43, bottom: 40 }, { left: 79, bottom: 58 },
  { left: 9, bottom: 44 }, { left: 68, bottom: 34 }, { left: 34, bottom: 62 }, { left: 52, bottom: 28 },
];
const LUCKY_BUTTERFLY_COLORS = ["#6fa7d8", "#8f7fc0", "#e8995c", "#e07a9b"];
const LUCKY_BEE_COLORS = { body: "#f7cf5a", stripe: "#4a3626", face: "#2b1d14", cheek: "#f3a1a1", wing: "rgba(255, 255, 255, 0.86)", wingEdge: "#9ec5e8" };
let luckyBeeCount = 0;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function luckyBeeSvg(mood) {
  luckyBeeCount += 1;
  const clipId = `luckyBeeBody${luckyBeeCount}`;
  const c = LUCKY_BEE_COLORS;
  const mouth = mood === "sad" ? "M45 73 Q50 68 55 73" : "M45 69 Q50 74.5 55 69";
  return (
    '<svg viewBox="0 0 120 110" aria-hidden="true" focusable="false">' +
    `<defs><clipPath id="${clipId}"><ellipse cx="60" cy="66" rx="34" ry="28"/></clipPath></defs>` +
    '<g class="lucky-bee-wing lucky-bee-wing--left" style="transform-origin: 52px 50px">' +
    `<ellipse cx="50" cy="34" rx="12" ry="17" fill="${c.wing}" stroke="${c.wingEdge}" stroke-width="2" transform="rotate(-22 50 34)"/></g>` +
    '<g class="lucky-bee-wing lucky-bee-wing--right" style="transform-origin: 70px 50px">' +
    `<ellipse cx="73" cy="32" rx="13" ry="18" fill="${c.wing}" stroke="${c.wingEdge}" stroke-width="2" transform="rotate(16 73 32)"/></g>` +
    `<path d="M46 41 C42 32 38 26 33 21" stroke="${c.stripe}" stroke-width="2.5" fill="none" stroke-linecap="round"/>` +
    `<path d="M58 39 C58 30 57 24 56 18" stroke="${c.stripe}" stroke-width="2.5" fill="none" stroke-linecap="round"/>` +
    `<circle cx="32" cy="20" r="3.2" fill="${c.stripe}"/><circle cx="56" cy="17" r="3.2" fill="${c.stripe}"/>` +
    `<path d="M92 64 L106 70 L92 76 Z" fill="${c.stripe}"/>` +
    `<ellipse cx="60" cy="66" rx="34" ry="28" fill="${c.body}"/>` +
    `<g clip-path="url(#${clipId})"><rect x="70" y="30" width="9" height="72" fill="${c.stripe}"/><rect x="85" y="30" width="8" height="72" fill="${c.stripe}"/></g>` +
    `<ellipse cx="42" cy="61" rx="4.2" ry="4.8" fill="${c.face}"/><ellipse cx="58" cy="59" rx="4.2" ry="4.8" fill="${c.face}"/>` +
    '<circle cx="40.6" cy="59.2" r="1.5" fill="#fff"/><circle cx="56.6" cy="57.2" r="1.5" fill="#fff"/>' +
    `<ellipse cx="37" cy="70" rx="4.2" ry="2.4" fill="${c.cheek}" opacity="0.75"/><ellipse cx="63" cy="68" rx="4.2" ry="2.4" fill="${c.cheek}" opacity="0.75"/>` +
    `<path d="${mouth}" stroke="${c.face}" stroke-width="2.2" fill="none" stroke-linecap="round"/>` +
    '<g class="lucky-bee-arm lucky-bee-arm--wave" style="transform-origin: 38px 80px">' +
    `<path d="M38 80 L27 67" stroke="${c.stripe}" stroke-width="4.5" stroke-linecap="round"/><circle cx="26" cy="66" r="3.6" fill="${c.stripe}"/></g>` +
    `<path d="M70 88 L78 97" stroke="${c.stripe}" stroke-width="4.5" stroke-linecap="round"/><circle cx="79" cy="98" r="3.6" fill="${c.stripe}"/>` +
    `<path d="M48 93 L45 104" stroke="${c.stripe}" stroke-width="4" stroke-linecap="round"/>` +
    `<path d="M62 94 L64 105" stroke="${c.stripe}" stroke-width="4" stroke-linecap="round"/>` +
    "</svg>"
  );
}

// variant: hello (waving, signposts), avatar (beside feedback), party (done), sad (exit).
function luckyBee(variant) {
  const bee = el("span", `lucky-bee lucky-bee--${variant}`);
  bee.innerHTML = luckyBeeSvg(variant === "sad" ? "sad" : "happy");
  return bee;
}

function luckyFlower() {
  const petal = (cx, cy, rx, ry, color, minStage, maxStage) => {
    let petals = "";
    for (let angle = 0; angle < 360; angle += 60) {
      petals += `<ellipse cx="${cx}" cy="${cy - ry}" rx="${rx}" ry="${ry}" fill="${color}" transform="rotate(${angle} ${cx} ${cy})"/>`;
    }
    const max = maxStage === undefined ? "" : ` data-max-stage="${maxStage}"`;

  { id: "CBT-C", answer: "Framing stance", feature: "Self-blame is part of how the person reads the situation, so reattribution is pushback on the framing." },
  { id: "CBT-E", answer: "Information", feature: "Explaining how thoughts shape feelings is Information." },
  { id: "CBT-D", answer: "Advice", feature: "Devising and offering solutions is Advice." },
];

// Quiz 2, type 2: which rule follows? `rule` holds two wordings of the correct rule
// (the second for the retake); the foils swap the value, the direction, or the condition.
const QUIZ2_RULE = [
  {
    id: "CBT-F",
    rule: [
      "Validation = yes whenever the situation is unpleasant for the person, whether they were in the right or in the wrong.",
      "If the situation is painful for the person, Validation = yes; being in the wrong does not change that.",
    ],
    foils: [
      "Validation = yes only when the person was in the right.",
      "Validation = no when the person was in the wrong, so the feeling is not reinforced.",
      "Framing stance = Confirmation whenever the situation is unpleasant.",
    ],
    feature: "The feeling is acknowledged regardless of conduct; only the thoughts are evaluated.",
  },
  {
    id: "CBT-B",
    rule: [
      "Framing stance = pushback (Indirect pushback or Explicit refutation) when the person’s reading departs from the facts; no pushback when it matches them.",
      "When the facts contradict the person’s reading, the framing stance is pushback; when the facts support it, it is not.",
    ],
    foils: [
      "Framing stance = pushback on every reading, since any thought can be examined.",
      "Framing stance = Take no position whatever the facts.",
      "Framing stance = Confirmation whenever the reading departs from the facts, to build rapport first.",
    ],
    feature: "The response depends on the evidence, in that direction: pushback when the facts contradict the reading.",
  },
  {
    id: "CBT-A",
    rule: [
      "Framing stance = Explicit refutation only rarely; when pushing back, Indirect pushback is the usual form.",
      "Pushback on the framing is usually Indirect pushback; Explicit refutation is rare.",
    ],
    foils: [
      "Framing stance = Explicit refutation whenever the thought is inaccurate.",
      "Questioning = no, since questions would put the person on the spot.",
      "Framing stance = Take no position always; thoughts are never examined.",
    ],
    feature: "Thoughts are examined, but through questions and softer pushback, rarely a flat refutation.",
  },
  {
    id: "CBT-G",
    rule: ["Questioning = yes in most responses.", "Most responses include at least one question."],
    foils: [
      "Questioning = yes in every response, with nothing else.",
      "Questioning = no in most responses; the counselor explains instead.",
      "Paraphrasing = yes in most responses; questions are avoided.",
    ],
    feature: "Often, not always and not exclusively.",
  },
  {
    id: "CBT-C",
    rule: [
      "When the person blames themself and the facts do not support it, Framing stance = pushback; when the blame is warranted, no pushback on it.",
      "Self-blame gets pushback on the framing only when the facts do not support the blame.",
    ],
    foils: [
      "When the person blames themself, Framing stance = pushback regardless of the facts.",
      "When the person blames themself, Framing stance = Confirmation, since self-awareness should be reinforced.",
      "When the person blames themself, Action stance = Explicit refutation of what they did.",
    ],
    feature: "Reattribution is for unrealistic blame; deserved blame is not argued away.",
  },
  {
    id: "CBT-E",
    rule: [
      "Information = yes in most responses: an explanation of how the thought or perception shaped the feeling.",
      "Most responses include Information, typically an explanation of how the interpretation drove the feeling.",
    ],
    foils: [
      "Information = no; explanations are left to the person to discover.",
      "Advice = yes in most responses.",
      "Information = yes only when the person explicitly asks why.",
    ],
    feature: "CBT is educative, so explanation is the norm, not something reserved for when it is requested.",
  },
  {
    id: "CBT-D",
    rule: [
      "Advice = yes when the person asks what to do; Advice = no when the person asks to understand a reaction or another person.",
      "If the person asks what to do, Advice = yes; if they ask to understand something, Advice = no.",
    ],
    foils: [
      "Advice = yes in every response, since CBT is directive.",
      "Advice = no unless the person gives explicit permission.",
      "Advice = yes when the person asks to understand a reaction, since understanding leads to action.",
    ],
    feature: "Advice tracks the kind of task, not permission, and is withheld when the task is understanding.",
  },
];

const THRESHOLDS = {
  quiz1Pass: 6, // of the 7 principle items (strength warm-ups are not scored)
  quiz2Pass: 12, // of 14
  attempts: 2,
};

</script>
    <script>
// The training flow: welcome -> principle cards -> quiz 1 -> response dimensions ->
// quiz 2 -> done. Content comes from content_<school>.js, decorations from garden.js.
// Progress is kept in localStorage (best effort) so a reload resumes the same screen.

const STEPS = ["Welcome", "Principles", "Quiz", "Response dimensions", "Quiz", "Done"];
const STORAGE_KEY = `ns-training-${SCHOOL.key}`;
// Debug mode (jump bar, skip buttons, continue past a failed quiz): ?debug or a /debug path.
const DEBUG = new URLSearchParams(window.location.search).has("debug") || /\/debug(\/|\/index\.html)?$/.test(window.location.pathname);

const state = {
  screen: "welcome",
  critters: 0,
  q1: { attempt: 1, answers: {} }, // answers: item id -> {picked, correct, source, attempt}
  q2: { attempt: 1, answers: {} },
  startedAt: new Date().toISOString(),
  log: [],
};

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
function restore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && typeof saved === "object") Object.assign(state, saved);
  } catch (e) { /* ignore */ }
}

// Deterministic shuffle so a retake reshuffles but a reload does not.
function seededOrder(n, seedText) {
  let h = 2166136261;
  for (const ch of seedText) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    h = (Math.imul(h, 1664525) + 1013904223) >>> 0;
    const j = h % (i + 1);
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

const cardById = Object.fromEntries(CARDS.map((c) => [c.id, c]));
const cardNumber = (id) => CARDS.findIndex((c) => c.id === id) + 1;

// ---------------------------------------------------------------------------
// Scaffolding.

const titleEl = document.getElementById("title");
const ledeEl = document.getElementById("lede");
const eyebrowEl = document.getElementById("eyebrow");
const bodyEl = document.getElementById("body");
const stepLabelEl = document.getElementById("stepLabel");
const progressFill = document.getElementById("progressFill");
const flower = luckyFlower();
document.getElementById("flower").appendChild(flower.node);

function setHero({ eyebrow, title, lede, step, frac }) {
  eyebrowEl.textContent = eyebrow || "";
  eyebrowEl.hidden = !eyebrow;
  titleEl.textContent = title || "";
  titleEl.hidden = !title;
  ledeEl.textContent = lede || "";
  ledeEl.hidden = !lede;
  stepLabelEl.textContent = `Step ${step + 1} of ${STEPS.length} · ${STEPS[step]}`;
  progressFill.style.width = `${Math.round(((step + (frac || 0)) / (STEPS.length - 1)) * 100)}%`;
  flower.setStage(Math.min(LUCKY_FLOWER_STAGES, step));
}

function screen(opts) {
  bodyEl.innerHTML = "";
  for (const g of document.body.querySelectorAll(".lucky-garden")) g.remove();
  document.body.appendChild(luckyGardenRow(state.critters));
  setHero(opts);
  window.scrollTo(0, 0);
}

function button(text, secondary) {
  const b = el("button", secondary ? "submit-button submit-button--secondary" : "submit-button", text);
  b.type = "button";
  return b;
}
function nav(...buttons) {
  const n = el("div", "lucky-nav");
  n.append(...buttons);
  return n;
}
function go(key) {
  state.screen = key;
  save();
  render();
}

// A one-sentence page with the waving bee.
function signpost({ step, frac, text, sub, extra, back, next, nextLabel, withBee = true }) {
  screen({ step, frac });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  if (withBee) body.appendChild(luckyBee("hello"));
  body.appendChild(el("p", "survey-signpost-text", text));
  if (sub) body.appendChild(el("p", "survey-signpost-sub", sub));
  if (extra) body.appendChild(extra);
  card.appendChild(body);
  const buttons = [];
  if (back) { const b = button("← Back", true); b.addEventListener("click", back); buttons.push(b); }
  const n = button(nextLabel || "Next →");
  n.addEventListener("click", next);
  buttons.push(n);
  card.appendChild(nav(...buttons));
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Welcome and principle cards.

function renderWelcome() {
  signpost({
    step: 0, frac: 0,
    text: `Welcome! In this study you will learn how a counselor trained in ${SCHOOL.name} (${SCHOOL.short}) responds to someone who brings them a difficult situation.`,
    next: () => go("apply"),
    nextLabel: "Start →",
  });
}

function renderApply() {
  signpost({
    step: 0, frac: 0.5,
    text: "We will then ask you to apply the principles you learn to label what ideal responses to interpersonal conflicts look like.",
    back: () => go("welcome"),
    next: () => go("intro"),
  });
}

function renderIntro() {
  signpost({
    step: 1, frac: 0,
    text: `We are going to step through ${CARDS.length} principles you will later need to apply as a ${SCHOOL.short} expert.`,
    back: () => go("apply"),
    next: () => go("card:0"),
  });
}

function principleCard(c, i) {
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", `Principle ${i + 1} of ${CARDS.length}`));
  const body = el("div", "survey-card-body");
  body.appendChild(el("p", "principle-text", c.teaches));
  const rules = el("div", "rules");
  const rin = el("div", "rule rule--in"); rin.append(el("span", "rule-label", "In keeping with the principle"), c.rulesIn);
  const rout = el("div", "rule rule--out"); rout.append(el("span", "rule-label", "Against the principle"), c.rulesOut);
  rules.append(rin, rout);
  body.appendChild(rules);
  card.appendChild(body);
  return card;
}

function renderCard(i) {
  const c = CARDS[i];
  screen({ step: 1, frac: (i + 1) / (CARDS.length + 1) });
  const card = principleCard(c, i);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(i === 0 ? "intro" : `card:${i - 1}`));
  const next = button("Next →");
  next.addEventListener("click", () => {
    if (i === CARDS.length - 1) { state.critters = Math.max(state.critters, 1); go("q1intro"); }
    else go(`card:${i + 1}`);
  });
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Generic multiple-choice item with immediate feedback.
//
// options: [{text, correct, source}]; `record` receives {picked, correct} once the
// answer is checked. `onNext` is wired to the Next button that appears after feedback.
function choiceItem({ step, frac, eyebrow, stem, before, options, seed, feature, prior, onBack, onNext, record }) {
  screen({ step, frac });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", eyebrow));
  if (before) card.appendChild(before);
  card.appendChild(el("p", "survey-question-text", stem));
  const order = seededOrder(options.length, seed);
  const shown = order.map((k) => options[k]);
  const choices = el("div", "control-choices");
  const inputs = [];
  let picked = null;
  shown.forEach((opt, idx) => {
    const label = el("label", "control-choice");
    const input = document.createElement("input");
    input.type = "radio"; input.name = "choice"; input.value = String(idx);
    input.addEventListener("change", () => { picked = idx; check.disabled = false; });
    label.append(input, el("span", null, opt.text));
    choices.appendChild(label);
    inputs.push({ label, input, opt });
  });
  card.appendChild(choices);
  const feedbackHolder = el("div");
  card.appendChild(feedbackHolder);
  const check = button("Check answer");
  check.disabled = true;
  const next = button("Next →");
  next.hidden = true;
  const back = button("← Back", true);
  back.addEventListener("click", onBack);
  back.hidden = !onBack;

  function reveal(pickedIdx) {
    const correct = shown[pickedIdx].correct;
    inputs.forEach(({ label, input, opt }, idx) => {
      input.disabled = true;
      label.classList.add("control-choice--locked");
      if (opt.correct) { label.classList.add("control-choice--correct"); label.appendChild(el("span", "choice-tag", SCHOOL.short)); }
      else if (idx === pickedIdx) { label.classList.add("control-choice--wrong"); label.appendChild(el("span", "choice-tag", "your pick")); }
    });
    const row = el("div", "lucky-chat-row");
    row.appendChild(luckyBee("avatar"));
    const bubble = el("p", `lucky-chat-bubble ${correct ? "lucky-chat-bubble--ok" : "lucky-chat-bubble--bad"}`);
    bubble.append(el("b", null, correct ? "That’s right. " : "Not quite. "), feature);
    row.appendChild(bubble);
    feedbackHolder.appendChild(row);
    check.hidden = true;
    next.hidden = false;
    return correct;
  }

  if (prior) {
    // Re-rendering an answered item (Back / reload): show the earlier result, locked.
    const idx = shown.findIndex((o) => o.text === prior.picked);
    if (idx >= 0) { inputs[idx].input.checked = true; reveal(idx); }
  }
  check.addEventListener("click", () => {
    if (picked === null) return;
    const correct = reveal(picked);
    record({ picked: shown[picked].text, source: shown[picked].source || null, correct });
    save();
  });
  next.addEventListener("click", onNext);
  const n = nav(back, el("span", "spacer"), check, next);
  if (DEBUG) {
    const skip = button("Skip (debug) →", true);
    skip.addEventListener("click", onNext);
    n.insertBefore(skip, check);
  }
  card.appendChild(n);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Quiz 1: strength warm-ups, then one item per principle.

const Q1_ITEMS = [...QUIZ1_STRENGTH.map((q) => ({ kind: "strength", q })), ...QUIZ1.map((q) => ({ kind: "claim", q }))];

function renderQ1Intro() {
  signpost({
    step: 2, frac: 0,
    text: "We will now quiz you on your understanding of these principles.",
    back: () => go(`card:${CARDS.length - 1}`),
    next: () => go("q1:0"),
    nextLabel: "Begin →",
  });
}

function renderQ1(i) {
  const { kind, q } = Q1_ITEMS[i];
  const attempt = state.q1.attempt;
  const key = `${q.id}@${attempt}`;
  const prior = state.q1.answers[key];
  let options, eyebrow;
  if (kind === "strength") {
    options = q.options.map((o) => ({ text: o.text, correct: o.correct, source: o.correct ? q.claim : "strength-foil" }));
    eyebrow = `Question ${i + 1} of ${Q1_ITEMS.length}`;
  } else {
    options = [
      { text: q.cbt[(attempt - 1) % q.cbt.length], correct: true, source: q.id },
      ...q.foils.map((f) => ({ text: f.text, correct: false, source: f.source })),
    ];
    eyebrow = `Question ${i + 1} of ${Q1_ITEMS.length}` + (attempt > 1 ? ` · attempt ${attempt}` : "");
  }
  choiceItem({
    step: 2, frac: (i + 1) / (Q1_ITEMS.length + 1), eyebrow, stem: q.stem, options,
    seed: key, feature: q.feature, prior,
    onBack: i === 0 ? () => go("q1intro") : () => go(`q1:${i - 1}`),
    onNext: () => go(i === Q1_ITEMS.length - 1 ? "q1result" : `q1:${i + 1}`),
    record: (r) => { state.q1.answers[key] = { ...r, kind, attempt }; },
  });
}

function q1Score(attempt) {
  return QUIZ1.filter((q) => (state.q1.answers[`${q.id}@${attempt}`] || {}).correct).length;
}

function resultScreen({ step, score, total, pass, passLabel, missed, onPass, onRetake, onExit, retakeLabel, attempt }) {
  screen({ step, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee(pass ? "party" : attempt < THRESHOLDS.attempts ? "hello" : "sad"));
  const sc = el("div", "score"); sc.append(`${score} / ${total}`, el("small", null, pass ? "passed" : "not yet"));
  body.appendChild(sc);
  body.appendChild(el("p", "survey-signpost-text", pass ? passLabel : attempt < THRESHOLDS.attempts
    ? "Not quite there. Have another look at the principles you missed, then try the quiz again with fresh wording."
    : "That is the second attempt, so the study ends here. Thank you for your time."));
  if (missed.length) {
    const list = el("ul", "review-list");
    for (const m of missed) {
      const li = el("li"); li.append(el("span", "mark mark--bad", "✗"), m);
      list.appendChild(li);
    }
    body.appendChild(list);
  }
  card.appendChild(body);
  if (pass) { const n = button("Next →"); n.addEventListener("click", onPass); card.appendChild(nav(n)); }
  else {
    const buttons = [];
    if (attempt < THRESHOLDS.attempts) { const r = button(retakeLabel); r.addEventListener("click", onRetake); buttons.push(r); }
    else { const e = button("Finish"); e.addEventListener("click", onExit); buttons.push(e); }
    if (DEBUG) { const c = button("Continue anyway (debug) →", true); c.addEventListener("click", onPass); buttons.unshift(c); }
    card.appendChild(nav(...buttons));
  }
  bodyEl.appendChild(card);
}

function renderQ1Result() {
  const attempt = state.q1.attempt;
  const score = q1Score(attempt);
  const pass = score >= THRESHOLDS.quiz1Pass;
  const missedIds = QUIZ1.filter((q) => !(state.q1.answers[`${q.id}@${attempt}`] || {}).correct).map((q) => q.id);
  state.q1.missed = missedIds;
  if (pass) state.critters = Math.max(state.critters, 2);
  save();
  resultScreen({
    step: 2, score, total: QUIZ1.length, pass, attempt,
    passLabel: `You can tell ${SCHOOL.short} apart from the other approaches. Next: the questions we ask about responses.`,
    missed: missedIds.map((id) => `Principle ${cardNumber(id)}: ${cardById[id].teaches}`),
    onPass: () => go("dims:0"),
    retakeLabel: "Review the missed principles →",
    onRetake: () => { state.q1.attempt += 1; go("q1review:0"); },
    onExit: () => go("exit"),
  });
}

// Before a retake: the missed principles' cards again, one per page.
function renderQ1Review(i) {
  const missed = state.q1.missed || [];
  if (!missed.length) return go("q1:0");
  const id = missed[i];
  screen({ step: 2, frac: 0 });
  const card = principleCard(cardById[id], cardNumber(id) - 1);
  const next = button(i === missed.length - 1 ? "Retake the quiz →" : "Next →");
  next.addEventListener("click", () => go(i === missed.length - 1 ? `q1:${QUIZ1_STRENGTH.length}` : `q1review:${i + 1}`));
  card.appendChild(nav(next));
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Stage 2: response dimensions.

function principleTag(ids) {
  return ids.map((id) => `Principle ${cardNumber(id)}`).join(" · ");
}

function dimsScreen0() {
  screen({ step: 3, frac: 0.1 });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", "Response dimensions · 1 of 4"));
  card.appendChild(el("h2", null, "What we will ask about each response"));
  const body = el("div", "survey-card-body");
  body.appendChild(el("p", "principle-teaches", "In the main task you will read a person’s situation and their message to an AI assistant, then say how a CBT counselor would respond, using eleven questions about the response:"));
  const list = el("ul", "notes");
  list.append(
    el("li", null, "Nine yes/no questions: which emotional support strategies the response should include (for example, Validation, Questioning, Advice)."),
    el("li", null, "Two stance questions: which stance the response should lead with toward the person’s action, and toward how the person reads the situation."),
  );
  body.appendChild(list);
  body.appendChild(el("p", "callout", "Four of the strategies and one of the stances are constrained by the CBT principles you just learned. The next pages show which ones, and how."));
  card.appendChild(body);
  const back = button("← Back", true); back.addEventListener("click", () => go("q1result"));
  const next = button("Next →"); next.addEventListener("click", () => go("dims:1"));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function dimsScreen1() {
  screen({ step: 3, frac: 0.35 });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", "Response dimensions · 2 of 4"));
  card.appendChild(el("h2", null, "The nine support strategies"));
  const body = el("div", "survey-card-body");
  body.appendChild(el("p", "survey-signpost-sub", "Each is a yes/no: does the response include it anywhere? Highlighted ones are constrained by a CBT principle."));
  const list = el("div", "dim-list");
  for (const t of TACTICS) {
    const d = el("div", `dim${t.cbt ? " dim--cbt" : ""}`);
    const head = el("div", "dim-head"); head.appendChild(el("span", "dim-name", t.name));
    if (t.cbt) head.appendChild(el("span", "dim-tag", principleTag(t.cbt)));
    d.append(head, el("p", "dim-def", t.def), el("p", "dim-ex", `Example: ${t.ex}`));
    list.appendChild(d);
  }
  body.appendChild(list);
  const notes = el("ul", "notes");
  for (const n of TACTIC_NOTES) notes.appendChild(el("li", null, n));
  body.appendChild(notes);
  card.appendChild(body);
  const back = button("← Back", true); back.addEventListener("click", () => go("dims:0"));
  const next = button("Next →"); next.addEventListener("click", () => go("dims:2"));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function dimsScreen2() {
  screen({ step: 3, frac: 0.6 });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", "Response dimensions · 3 of 4"));
  card.appendChild(el("h2", null, "The two stances"));
  const body = el("div", "survey-card-body");
  body.appendChild(el("p", "survey-signpost-sub", "For each stance: which option should the response lead with? Both use the same six options; what differs is the target."));
  const grid = el("div", "stance-grid");
  for (const s of STANCES) {
    const box = el("div", `stance${s.cbt.length ? " stance--cbt" : ""}`);
    const h = el("h3", null, s.name);
    box.appendChild(h);
    if (s.cbt.length) box.appendChild(el("span", "dim-tag", principleTag(s.cbt)));
    box.appendChild(el("p", "target", `Target: ${s.target}.`));
    box.appendChild(el("p", "note", s.note));
    grid.appendChild(box);
  }
  body.appendChild(grid);
  const table = el("table", "option-table");
  for (const o of STANCE_OPTIONS) {
    const tr = el("tr");
    const td1 = el("td"); td1.append(o.name);
    if (o.group !== "none") td1.appendChild(el("span", `group-pill group-pill--${o.group}`, o.group));
    const td2 = el("td", null, o.def.replace(/\[target\]/g, "action or framing"));
    tr.append(td1, td2);
    table.appendChild(tr);
  }
  body.appendChild(table);
  const notes = el("ul", "notes");
  for (const n of STANCE_NOTES) notes.appendChild(el("li", null, n));
  body.appendChild(notes);
  card.appendChild(body);
  const back = button("← Back", true); back.addEventListener("click", () => go("dims:1"));
  const next = button("Next →"); next.addEventListener("click", () => go("dims:3"));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function dimsScreen3() {
  screen({ step: 3, frac: 0.85 });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", "Response dimensions · 4 of 4"));
  card.appendChild(el("h2", null, "Reading the situation"));
  const body = el("div", "survey-card-body");
  body.appendChild(el("p", "principle-teaches", "Several principles say “it depends”. What they depend on is in the situation you will read. Before deciding how the counselor responds, answer these five questions for yourself:"));
  const list = el("div", "feature-list");
  for (const f of SITUATION_FEATURES) {
    const d = el("div", "feature");
    d.append(el("div", "q", f.q), el("p", "d", f.detail), el("p", "w", f.why));
    list.appendChild(d);
  }
  body.appendChild(list);
  card.appendChild(body);
  const back = button("← Back", true); back.addEventListener("click", () => go("dims:2"));
  const next = button("Next →"); next.addEventListener("click", () => { state.critters = Math.max(state.critters, 3); go("q2intro"); });
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

const DIMS_SCREENS = [dimsScreen0, dimsScreen1, dimsScreen2, dimsScreen3];

// ---------------------------------------------------------------------------
// Quiz 2: which dimension, then which rule.

const Q2_ITEMS = [...QUIZ2_DIMENSION.map((q) => ({ kind: "dimension", q })), ...QUIZ2_RULE.map((q) => ({ kind: "rule", q }))];

function renderQ2Intro() {
  signpost({
    step: 4, frac: 0,
    text: "We will now quiz you on how these principles relate to the questions you just saw.",
    back: () => go("dims:3"),
    next: () => go("q2:0"),
    nextLabel: "Begin →",
  });
}

function principleRef(id) {
  const c = cardById[id];
  const p = el("div", "principle-ref");
  p.append(el("span", "card-eyebrow", `Principle ${cardNumber(id)}`), c.teaches);
  return p;
}

function renderQ2(i) {
  const { kind, q } = Q2_ITEMS[i];
  const attempt = state.q2.attempt;
  const key = `${kind}:${q.id}@${attempt}`;
  const prior = state.q2.answers[key];
  let options, stem, eyebrow;
  if (kind === "dimension") {
    options = DIMENSION_OPTIONS.map((d) => ({ text: d, correct: d === q.answer, source: d }));
    stem = "Which response dimension does this principle tell you about?";
    eyebrow = `Question ${i + 1} of ${Q2_ITEMS.length}` + (attempt > 1 ? ` · attempt ${attempt}` : "");
  } else {
    options = [
      { text: q.rule[(attempt - 1) % q.rule.length], correct: true, source: q.id },
      ...q.foils.map((f, k) => ({ text: f, correct: false, source: `foil-${k + 1}` })),
    ];
    stem = "Which rule follows from this principle?";
    eyebrow = `Question ${i + 1} of ${Q2_ITEMS.length}` + (attempt > 1 ? ` · attempt ${attempt}` : "");
  }
  choiceItem({
    step: 4, frac: (i + 1) / (Q2_ITEMS.length + 1), eyebrow, stem, before: principleRef(q.id), options,
    seed: key, feature: q.feature, prior,
    onBack: i === 0 ? () => go("q2intro") : () => go(`q2:${i - 1}`),
    onNext: () => go(i === Q2_ITEMS.length - 1 ? "q2result" : `q2:${i + 1}`),
    record: (r) => { state.q2.answers[key] = { ...r, kind, attempt }; },
  });
}

function q2Score(attempt) {
  return Q2_ITEMS.filter(({ kind, q }) => (state.q2.answers[`${kind}:${q.id}@${attempt}`] || {}).correct).length;
}

function renderQ2Result() {
  const attempt = state.q2.attempt;
  const score = q2Score(attempt);
  const pass = score >= THRESHOLDS.quiz2Pass;
  const missed = Q2_ITEMS.filter(({ kind, q }) => !(state.q2.answers[`${kind}:${q.id}@${attempt}`] || {}).correct);
  if (pass) state.critters = Math.max(state.critters, 4);
  save();
  resultScreen({
    step: 4, score, total: Q2_ITEMS.length, pass, attempt,
    passLabel: "You know how the principles map onto the questions. You are ready for the main task.",
    missed: missed.map(({ kind, q }) => `${kind === "dimension" ? "Which dimension" : "Which rule"}, principle ${cardNumber(q.id)}: ${cardById[q.id].teaches}`),
    onPass: () => go("done"),
    retakeLabel: "Retake the quiz →",
    onRetake: () => { state.q2.attempt += 1; go("dims:1"); },
    onExit: () => go("exit"),
  });
}

// ---------------------------------------------------------------------------
// End screens.

function exportText() {
  return JSON.stringify({ school: SCHOOL.key, startedAt: state.startedAt, finishedAt: new Date().toISOString(),
    q1: state.q1, q2: state.q2 }, null, 1);
}

function renderDone() {
  screen({ step: 5, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee("party"));
  body.appendChild(el("p", "survey-signpost-text", "Training complete. The main task comes next: you will read situations and say how a CBT counselor would respond."));
  body.appendChild(el("p", "survey-signpost-sub", `Principles quiz: ${q1Score(state.q1.attempt)} of ${QUIZ1.length} on attempt ${state.q1.attempt}. Dimensions quiz: ${q2Score(state.q2.attempt)} of ${Q2_ITEMS.length} on attempt ${state.q2.attempt}.`));
  const ta = el("textarea", "export"); ta.readOnly = true; ta.value = exportText();
  body.appendChild(el("p", "survey-signpost-sub", "Preview build: the answers recorded during training, as they would be submitted."));
  body.appendChild(ta);
  card.appendChild(body);
  const next = button("Continue to the main task →"); next.disabled = true; next.title = "Not part of this preview";
  const reset = button("Start over", true); reset.addEventListener("click", resetAll);
  card.appendChild(nav(reset, next));
  bodyEl.appendChild(card);
}

function renderExit() {
  screen({ step: 5, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee("sad"));
  body.appendChild(el("p", "survey-signpost-text", "Thank you for your time. The study ends here."));
  body.appendChild(el("p", "survey-signpost-sub", "You will be paid for the training portion you completed."));
  card.appendChild(body);
  const reset = button("Start over", true); reset.addEventListener("click", resetAll);
  card.appendChild(nav(reset));
  bodyEl.appendChild(card);
}

function resetAll() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  state.critters = 0; state.q1 = { attempt: 1, answers: {} }; state.q2 = { attempt: 1, answers: {} };
  state.startedAt = new Date().toISOString();
  go("welcome");
}

// ---------------------------------------------------------------------------
// Router.

function render() {
  const [kind, arg] = state.screen.split(":");
  const i = Number(arg);
  switch (kind) {
    case "welcome": return renderWelcome();
    case "apply": return renderApply();
    case "intro": return renderIntro();
    case "card": return renderCard(i);
    case "q1intro": return renderQ1Intro();
    case "q1": return renderQ1(i);
    case "q1result": return renderQ1Result();
    case "q1review": return renderQ1Review(i);
    case "dims": return DIMS_SCREENS[i]();
    case "q2intro": return renderQ2Intro();
    case "q2": return renderQ2(i);
    case "q2result": return renderQ2Result();
    case "done": return renderDone();
    case "exit": return renderExit();
    default: state.screen = "welcome"; return renderWelcome();
  }
}

if (DEBUG) {
  const bar = el("div", "debug-bar");
  for (const [label, key] of [["welcome", "welcome"], ["cards", "card:0"], ["quiz 1", "q1intro"], ["dims", "dims:0"], ["quiz 2", "q2intro"], ["done", "done"], ["reset", null]]) {
    const b = el("button", null, label);
    b.addEventListener("click", () => (key ? go(key) : resetAll()));
    bar.appendChild(b);
  }
  document.body.appendChild(bar);
}

restore();
render();

</script>
  </body>
</html>
