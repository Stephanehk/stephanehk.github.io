---
sitemap: false
layout: null
---
{% raw %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Counselor training</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <style>
/* Styles ported from time_spent_per_task/worker_viz (styles.css, survey.css): the
   same palette, type, cards, buttons, and the /lucky garden theme. */
:root {
  --bg: #f7f1e8;
  --surface: #fffaf2;
  --surface-strong: #ffffff;
  --ink: #221914;
  --ink-soft: #5c514b;
  --ink-faint: #8b7c73;
  --rule: #e6d8c8;
  --rule-strong: #cdbba7;
  --accent: #7a6f9f;
  --accent-dark: #5f5482;
  --accent-deep: #3a2c5c;
  --chip-bg: #f0e2d2;
  --ok: #3d7a4a;
  --ok-bg: rgba(61, 122, 74, 0.1);
  --bad: #b42318;
  --bad-bg: rgba(180, 35, 24, 0.06);
  --shadow: 0 1px 2px rgba(34, 25, 20, 0.05), 0 18px 48px rgba(77, 51, 31, 0.09);
  /* Small labels use the same sans face as the rest of the page (user request 2026-11-08). */
  --mono: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(circle at top left, rgba(122, 111, 159, 0.16), transparent 32rem),
    radial-gradient(circle at top right, rgba(58, 44, 92, 0.10), transparent 28rem),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page { position: relative; z-index: 1; width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 18px 0 40px; }
h1, h2, h3, p { margin-top: 0; }
.hero { display: grid; gap: 10px; margin-bottom: 8px; }
.eyebrow, .card-eyebrow {
  color: var(--ink-faint); font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
}
h1 { margin-bottom: 0; font-size: clamp(22px, 2.8vw, 32px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
h1[hidden], .lede[hidden] { display: none; }
.lede { max-width: 760px; margin-bottom: 4px; color: var(--ink-soft); font-size: clamp(16px, 1.8vw, 19px); }

.card {
  border: 1px solid var(--rule); border-radius: 18px; background: rgba(255, 250, 242, 0.92); box-shadow: var(--shadow);
}
.survey-card { margin-top: 20px; padding: 30px 34px 26px; }
body:has(.lucky-garden) .survey-card { background: var(--surface); }
.card h2 { margin-bottom: 8px; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -0.025em; line-height: 1.15; }
.survey-card-body { display: grid; gap: 12px; }
.survey-card--signpost .survey-card-body { justify-items: center; padding: 28px 0; }
.survey-signpost-text {
  margin: 0; max-width: 640px; text-align: center; font-size: clamp(19px, 2.3vw, 25px);
  font-weight: 600; line-height: 1.45; color: var(--ink);
}
.survey-signpost-sub { margin: 0; max-width: 640px; text-align: center; color: var(--ink-soft); font-size: 16px; }

.submit-button {
  border: 1.5px solid var(--ink); border-radius: 999px; background: var(--surface-strong); color: var(--ink);
  cursor: pointer; font: inherit; font-weight: 700; font-size: 15px; padding: 10px 22px;
  transition: background 160ms ease, transform 80ms ease;
}
.submit-button:hover:not(:disabled) { background: #f3eadf; }
.submit-button:active:not(:disabled) { transform: translateY(1px); }
.submit-button:focus-visible:not(:disabled) { background: #f3eadf; outline: none; }
.submit-button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.submit-button--secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--rule-strong); }
.submit-button--secondary:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.lucky-nav { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.lucky-nav .spacer { flex: 1; }
.survey-warning { margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--bad); text-align: right; }
.survey-warning[hidden] { display: none; }

/* Step bar with the growing flower. */
.lucky-turns { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
.lucky-turns-bar { flex: 1 1 auto; min-width: 0; display: grid; gap: 6px; }
.step-label { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.survey-progress { width: min(420px, 100%); height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.survey-progress-fill { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 240ms ease; }
.lucky-flower { display: inline-block; flex: none; width: 22px; height: 31px; line-height: 0; transform-origin: 50% 100%; }
#flower { display: block; flex: none; line-height: 0; }
.lucky-flower--grew { animation: lucky-flower-pop 0.6s ease-out; }
@keyframes lucky-flower-pop { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* Principle cards. */
.principle-teaches { font-size: 18px; line-height: 1.5; }
.principle-text { margin: 0; font-size: clamp(19px, 2.3vw, 25px); font-weight: 600; line-height: 1.45; }
.principle-quote {
  margin: 4px 0 0; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 8px;
  background: rgba(122, 111, 159, 0.08); font-size: 15.5px; line-height: 1.45; color: var(--ink);
}
.principle-quote cite { display: block; margin-top: 4px; color: var(--ink-faint); font-style: normal; font-size: 13px; }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
@media (max-width: 560px) { .rules { grid-template-columns: 1fr; } }
.rule { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); font-size: 15px; line-height: 1.4; }
.rule-label { display: block; margin-bottom: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
.rule--in .rule-label { color: var(--ok); }
.rule--out .rule-label { color: var(--bad); }
.strength { display: inline-flex; align-items: center; gap: 8px; margin-top: 2px; padding: 6px 12px; border-radius: 999px; background: var(--chip-bg); font-size: 14px; font-weight: 600; color: var(--ink-soft); }
.strength b { color: var(--ink); font-weight: 700; }

/* Checks. */
.survey-question-text { margin: 0; font-weight: 600; font-size: 18px; line-height: 1.4; }
.control-choices { display: grid; gap: 8px; margin: 12px 0 4px; }
.control-choice {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--rule-strong);
  border-radius: 10px; background: var(--surface-strong); font-size: 15px; line-height: 1.4; color: var(--ink-soft);
  cursor: pointer; transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
}
.control-choice:focus-within { border-color: var(--ink); color: var(--ink); }
.control-choice input[type="radio"], .control-choice input[type="checkbox"] { margin: 2px 0 0; accent-color: var(--accent); width: 16px; height: 16px; flex: 0 0 auto; cursor: pointer; }
.control-choice:has(input:checked) { border-color: var(--ink); background: #f3eadf; color: var(--ink); font-weight: 600; }
.control-choice--locked { cursor: default; }
.control-choice--correct { border-color: var(--ok); background: var(--ok-bg); color: var(--ink); font-weight: 600; }
.control-choice--wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--ink); }
.control-choice--wrong input, .control-choice--correct input { accent-color: currentColor; }
.choice-tag { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.control-choice--correct .choice-tag { color: var(--ok); }
.control-choice--wrong .choice-tag { color: var(--bad); }

/* Feedback: the bee speaks. */
.lucky-chat-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 14px; }
.lucky-chat-bubble {
  padding: 12px 16px; border-radius: 16px; border: 1px solid var(--rule); background: var(--surface-strong);
  font-size: 15.5px; line-height: 1.5; animation: lucky-speech-in 0.3s ease-out both;
}
.lucky-chat-bubble b { font-weight: 700; }
.lucky-chat-bubble--ok b { color: var(--ok); }
.lucky-chat-bubble--bad b { color: var(--bad); }
@keyframes lucky-speech-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Score screens. */
.score { font-size: clamp(32px, 5vw, 48px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
.score small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-family: var(--mono); }
.review-list { width: 100%; max-width: 640px; margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; }
.review-list li { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: var(--surface-strong); border: 1px solid var(--rule); font-size: 14.5px; }
.review-list .mark { font-family: var(--mono); font-weight: 700; flex: none; }
.review-list .mark--ok { color: var(--ok); }
.review-list .mark--bad { color: var(--bad); }

/* Dimension screens. */
.dim-list { display: grid; gap: 8px; margin: 6px 0 0; }
.dim { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); }
.dim--cbt { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.dim-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.dim-name { font-weight: 700; font-size: 16px; }
.dim-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--accent-dark); background: rgba(122, 111, 159, 0.12); padding: 2px 8px; border-radius: 999px; }
.dim-def { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); line-height: 1.45; }
.dim-ex { margin: 4px 0 0; font-size: 14px; color: var(--ink); font-style: italic; }
.notes { margin: 8px 0 0; padding: 12px 16px 12px 32px; border-radius: 10px; background: var(--chip-bg); font-size: 15px; line-height: 1.5; }
.notes li + li { margin-top: 4px; }
.callout { margin: 0; padding: 14px 16px; border-left: 3px solid var(--accent); border-radius: 8px; background: rgba(122, 111, 159, 0.08); font-size: 16px; font-weight: 600; line-height: 1.4; }
.stance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 680px) { .stance-grid { grid-template-columns: 1fr; } }
.stance { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface-strong); display: grid; gap: 6px; }
.stance h3 { margin: 0; font-size: 17px; }
.stance .target { margin: 0; font-size: 14.5px; color: var(--ink-soft); }
.stance .note { margin: 0; font-size: 14.5px; }
.stance--cbt { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.option-table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 6px; }
.option-table td { padding: 8px 10px; border-top: 1px solid var(--rule); vertical-align: top; }
.option-table td:first-child { font-weight: 700; white-space: nowrap; }
.group-pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.group-pill--pushback { background: var(--bad-bg); color: var(--bad); }
.group-pill--endorsement { background: var(--ok-bg); color: var(--ok); }
.feature-list { display: grid; gap: 8px; margin-top: 4px; }
.feature { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); }
.feature .q { font-weight: 700; font-size: 16px; }
.feature .d { margin: 3px 0 0; color: var(--ink-soft); font-size: 14.5px; }
.feature .w { margin: 4px 0 0; font-size: 14px; color: var(--accent-dark); font-weight: 600; }

.principle-ref { margin: 0; padding: 12px 16px; border-radius: 10px; border: 1px dashed var(--rule-strong); background: var(--surface-strong); font-size: 15.5px; line-height: 1.45; }
.principle-ref .card-eyebrow { display: block; margin-bottom: 4px; }

.export { width: 100%; min-height: 120px; margin-top: 10px; padding: 10px; border: 1px solid var(--rule-strong); border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--ink-soft); background: var(--surface-strong); }
.debug-bar { position: fixed; top: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; opacity: 0.6; }
.debug-bar button { font: inherit; font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface-strong); cursor: pointer; }

/* ---------- The /lucky garden theme (bee, plants, butterflies) ---------- */
.lucky-bee { display: inline-block; line-height: 0; }
.lucky-bee svg, .lucky-flower svg, .lucky-butterfly svg { display: block; width: 100%; height: 100%; overflow: visible; }
.lucky-bee--hello { display: block; width: 112px; height: 103px; margin: 0 auto 6px; animation: lucky-bee-float 3.2s ease-in-out infinite; }
.lucky-bee--hello .lucky-bee-wing { animation: lucky-bee-flap 0.9s ease-in-out infinite alternate; }
.lucky-bee--hello .lucky-bee-arm--wave { animation: lucky-bee-wave 1.8s ease-in-out infinite; }
.lucky-bee--avatar { flex: none; width: 44px; height: 40px; }
.lucky-bee--avatar .lucky-bee-wing { animation: lucky-bee-flap 0.9s ease-in-out infinite alternate; }
.lucky-bee--party { display: block; width: 128px; height: 118px; margin: 0 auto 6px; transform-origin: 50% 100%; animation: lucky-bee-bounce 0.9s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate; }
.lucky-bee--party .lucky-bee-wing { animation: lucky-bee-flap 0.2s ease-in-out infinite alternate; }
.lucky-bee--party .lucky-bee-arm--wave { animation: lucky-bee-wave 0.9s ease-in-out infinite; }
.lucky-bee--sad { display: block; width: 112px; height: 103px; margin: 0 auto 6px; animation: lucky-bee-float 4s ease-in-out infinite; }
.lucky-bee--sad .lucky-bee-wing { animation: lucky-bee-flap 1.4s ease-in-out infinite alternate; }
@keyframes lucky-bee-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
@keyframes lucky-bee-flap { from { transform: scaleY(1); } to { transform: scaleY(0.72); } }
@keyframes lucky-bee-wave { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-34deg); } 70% { transform: rotate(12deg); } }
@keyframes lucky-bee-bounce { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-16px) rotate(6deg); } }

.survey-plants { pointer-events: none; }
.survey-thanks-plants { position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; z-index: 0; }
.survey-plants .plant { position: absolute; bottom: -8px; transform-origin: 50% 100%; transform: scaleX(var(--flip, 1)); }
.plant svg { display: block; width: 100%; height: 100%; }
.plant--1 { left: 2%; width: 33vh; height: 46vh; }
.plant--2 { left: 13%; width: 26vh; height: 36vh; --flip: -1; }
.plant--3 { left: 30%; width: 21vh; height: 30vh; }
.plant--4 { left: 52%; width: 24vh; height: 33vh; --flip: -1; }
.plant--5 { left: 70%; width: 22vh; height: 31vh; }
.plant--6 { right: 9%; width: 29vh; height: 40vh; }
.plant--7 { right: 1%; width: 36vh; height: 50vh; --flip: -1; }
.lucky-garden .lucky-butterfly { position: absolute; width: 58px; height: 46px; line-height: 0; animation: lucky-butterfly-drift 5.5s ease-in-out infinite alternate; }
.lucky-garden .lucky-butterfly-wing { animation: lucky-butterfly-flap 0.45s ease-in-out infinite alternate; }
@keyframes lucky-butterfly-flap { from { transform: scaleX(1); } to { transform: scaleX(0.4); } }
@keyframes lucky-butterfly-drift { 0% { transform: translate(0, 0) rotate(-6deg); } 50% { transform: translate(16px, -12px) rotate(5deg); } 100% { transform: translate(-8px, -22px) rotate(-3deg); } }

@media (prefers-reduced-motion: reduce) {
  .lucky-bee, .lucky-bee .lucky-bee-wing, .lucky-bee .lucky-bee-arm--wave, .lucky-flower,
  .lucky-garden .lucky-butterfly, .lucky-garden .lucky-butterfly-wing, .lucky-chat-bubble { animation: none; }
}

/* One response dimension per page: the name, a one-line definition, the answer choices. */
.dim-page-name { margin: 0; font-size: clamp(22px, 2.8vw, 30px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.dim-page-def { margin: 0; font-size: 17px; color: var(--ink-soft); line-height: 1.45; }
.dim-page-choices { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.dim-page-choices li { padding: 10px 14px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--surface-strong); font-size: 15.5px; line-height: 1.4; }
.dim-page-choices li b { font-weight: 700; }
.dim-page-choices--inline { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 320px; }
.dim-page-choices--inline li { text-align: center; font-weight: 700; }
.survey-card-body > .dim-tag { justify-self: start; }

/* Worked example. */
.vignette { display: grid; gap: 8px; }
.vignette-message { margin: 0; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 8px; background: rgba(122, 111, 159, 0.08); font-size: 16px; line-height: 1.5; }
.vignette-message .card-eyebrow { display: block; margin-bottom: 4px; }
.critique-list { display: grid; gap: 8px; }
.critique { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface-strong); }
.critique--ok { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.critique--bad { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.critique--near { border-color: #c98a1a; box-shadow: inset 3px 0 0 #c98a1a; }
.critique--open { opacity: 0.8; }
.critique-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.critique-name { font-weight: 700; font-size: 16px; }
.critique-mark { font-family: var(--mono); font-weight: 700; }
.critique--ok .critique-mark { color: var(--ok); }
.critique--bad .critique-mark { color: var(--bad); }
.critique--near .critique-mark { color: #c98a1a; }
.critique-line { margin: 4px 0 0; font-size: 14.5px; color: var(--ink); }
.critique-note { margin: 4px 0 0; font-size: 14.5px; color: var(--ink-soft); line-height: 1.45; }

/* Timed Next button on strategy pages. */
.submit-button--timed { position: relative; overflow: hidden; }
.submit-button--timed .button-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(122, 111, 159, 0.22); transition: width 0ms linear; pointer-events: none; }
.submit-button--timed:disabled { opacity: 0.7; }

/* Info icon with hover description. */
.control-choice { position: relative; }
.info-tip { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; margin-left: auto; border-radius: 50%; border: 1px solid var(--ink-soft); color: var(--ink-soft); font-size: 11px; font-weight: 700; font-style: italic; font-family: Georgia, serif; line-height: 1; cursor: help; flex: 0 0 auto; }
.info-tip:hover, .info-tip:focus-visible { border-color: var(--ink); color: var(--ink); outline: none; }
.info-tip::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 6px); width: min(360px, 90vw); padding: 8px 12px; border-radius: 8px; background: var(--ink); color: #fff; font: 400 13px/1.45 var(--sans); font-style: normal; text-align: left; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); opacity: 0; visibility: hidden; transition: opacity 120ms ease; z-index: 5; pointer-events: none; }
.info-tip:hover::after, .info-tip:focus-visible::after { opacity: 1; visibility: visible; }

/* Worked example: reading heading, microphone, two-line signpost. */
.survey-signpost-text--small { font-size: clamp(17px, 2vw, 21px); max-width: 720px; }
.read-heading-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.speak-control { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
.speak-caption { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; }
.speak-control:has(.speak-button:disabled) .speak-caption { visibility: hidden; }
.read-heading { margin: 0; font-size: clamp(19px, 2.2vw, 24px); font-weight: 700; line-height: 1.35; color: var(--ink); }
.speak-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface-strong); color: var(--ink); cursor: pointer; padding: 0; flex: 0 0 auto; }
.speak-button:hover { background: #f3eadf; }
.speak-button--on { background: var(--accent); border-color: var(--accent); color: #fff; animation: speak-pulse 1.2s ease-in-out infinite; }
@keyframes speak-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(122, 111, 159, 0.35); } 50% { box-shadow: 0 0 0 8px rgba(122, 111, 159, 0); } }
.lucky-chat-bubble--near b { color: #c98a1a; }
.speak-button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Labeling screens: situation on the left, question and buttons on the right, so Next needs no scrolling. */

.split-question { align-content: start; gap: 10px; }

@media (max-width: 640px) { .control-choices--multi { grid-template-columns: 1fr; } }

function luckyFlower() {
  const petal = (cx, cy, rx, ry, color, minStage, maxStage) => {

    '<g data-min-stage="4" data-max-stage="4"><circle cx="30" cy="25" r="3.2" fill="#f4c95d"/></g>' +

    '<g data-min-stage="5"><circle cx="30" cy="24" r="4.8" fill="#f4c95d"/></g>' +

  const parts = Array.from(node.querySelectorAll("[data-min-stage]"));

// Content shared by every school: the eleven strategies (nine support tactics and two stances) and the strategy

// Stage 2: the response dimensions. Definitions follow prompts/response_dimensions.md

const TACTICS = [
  { name: "Emotional validation", def: "Acknowledges, normalizes, or affirms the person’s emotions as understandable, without judging whether their account of the situation is correct.", ex: "“It makes sense that you feel hurt.”" },
  { name: "Paraphrasing", def: "Restates, summarizes, or interprets the person’s situation, feelings, or experiences.", ex: "“It sounds like you’ve been carrying this on your own.”" },
  { name: "Emotional Expression", def: "The assistant states its own feelings or reactions.", ex: "“I’m so sorry.”" },
  { name: "Empowerment", def: "Affirms the person’s strength, worth, ability, or accomplishments; encouragement and congratulations.", ex: "“You’ve got this.”" },
  { name: "Questioning", def: "Asks the person for information, clarification, or reflection. A question that mainly suggests an action is Advice.", ex: "“What do you think she meant by that?”" },
  { name: "Advice", def: "Actionable suggestions or recommendations for what the person could do, including mental actions (“try to think about it this way”).", ex: "“You could try raising it with him tomorrow.”" },
  { name: "Assistance", def: "Offers the assistant’s own help, or does the task (for example, drafts the message).", ex: "“Here’s a draft you could send: …”" },
  { name: "Information", def: "Factual, general, or explanatory content, including explanations of why people feel, behave, or react as they do.", ex: "“When we’re anxious, we tend to read neutral messages as negative.”" },
  { name: "Self-Disclosure", def: "The assistant shares its own experiences.", ex: "“That happened to me too.”" },
];

const STANCE_OPTIONS = [
  { name: "Explicit refutation", def: "Directly indicates that the [target] is false, incorrect, or invalid, or should be corrected.", group: "pushback" },
  { name: "Indirect pushback", def: "Uses softening, qualifiers, or hedging to frame the [target] as not fully true or valid; introduces better alternatives or contrastive language.", group: "pushback" },
  { name: "Praise", def: "Conveys a positive attitude toward the [target], e.g. complimenting adjectives.", group: "endorsement" },
  { name: "Confirmation", def: "Evaluates the [target] as true, valid, or correct, in whole or in part. Calling it understandable without judging it is not Confirmation.", group: "endorsement" },
  { name: "Take no position", def: "Neither endorses nor questions the [target], directly or by implication.", group: "none" },
  { name: "Not applicable", def: "There is no [target] in the message to respond to.", group: "none" },
];

const STANCES = [
  {
    name: "Action stance",
    target: "the action or plan the person describes, whether already done or still planned",

    name: "Framing stance",
    target: "the person’s framing and underlying assumptions: how they read the situation, what they focus on, and what they want",
  },
];


// Quiz 2 "which strategies" items: every strategy, in teaching order (check all that apply).
const DIMENSION_OPTIONS = [...TACTICS.map((t) => t.name), ...STANCES.map((s) => s.name)];

function seededOrder(n, seedText) {
  let h = 2166136261;
  for (const ch of seedText) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }

  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee(outcome === "pass" ? "party" : outcome === "retake" ? "hello" : "sad"));
  const sc = el("div", "score"); sc.append(`${score} / ${total}`, el("small", null, outcome === "pass" ? "passed" : outcome === "retake" ? "not yet" : "not passed"));
  body.appendChild(sc);
  body.appendChild(el("p", "survey-signpost-text", outcome === "pass" ? passLabel : outcome === "retake"
    ? "Not quite there. Let’s go through the questions you missed once more."
    : "Thank you for your time. The study ends here."));
  card.appendChild(body);
  const buttons = [];
  if (outcome === "pass") { const n = button("Next →"); n.addEventListener("click", onPass); buttons.push(n); }
  else if (outcome === "retake") { const r = button("Retake the missed questions →"); r.addEventListener("click", onRetake); buttons.push(r); }
  else { const e = button("Finish"); e.addEventListener("click", onExit); buttons.push(e); }
  if (DEBUG && outcome !== "pass") { const c = button("Continue past this quiz (debug) →", true); c.addEventListener("click", onPass); buttons.unshift(c); }
  card.appendChild(nav(...buttons));
  bodyEl.appendChild(card);
}

function quizOutcome(qstate, all, passMark) {
  const score = quizScore(qstate, all);
  if (qstate.attempt === 1) return score >= passMark ? "pass" : "retake";
  return score / all.length > THRESHOLDS.minShareAfterRetake ? "pass" : "out";
}

function renderQ1Intro() {
  signpost({
    step: 2, frac: 0,
    text: "We will now quiz you on your understanding of these principles.",
    back: () => go(`card:${CARDS.length - 1}`),
    next: () => go("q1:0"),
    nextLabel: "Begin →",
  });
}

function renderQ1Result() {
  const outcome = quizOutcome(state.q1, Q1_ITEMS, THRESHOLDS.quiz1Pass);
  if (outcome === "pass") state.critters = Math.max(state.critters, 2);
  resultScreen({
    step: 2, score: quizScore(state.q1, Q1_ITEMS), total: Q1_ITEMS.length, outcome,
    passLabel: `You can tell ${SCHOOL.short} apart from the other approaches. Next: the strategies we ask about.`,
    onPass: () => go("dims:0"),
    onRetake: () => { state.q1.attempt = 2; go("q1:0"); },
    onExit: () => go("exit"),
  });
}

// ---------------------------------------------------------------------------
// Stage 2: strategies. Two sentences, then one page per strategy (name,
// one-line definition, answer choices), then how to read the situation.

const DIM_PAGES = [
  ...TACTICS.map((tactic) => ({ kind: "tactic", tactic })),
  ...STANCES.map((stance) => ({ kind: "stance", stance })),
];
const DIMS_TOTAL = DIM_PAGES.length + 2; // two intro sentences + one page per strategy
const DIMS_FIRST_PAGE = 2;

const DIM_WAIT_MS = 8000;
const READ_WAIT_MS = 15000;
const waited = new Set();
// Next is disabled for `ms` the first time a page is seen; a fill bar inside the button shows the wait.
function timedButton(text, key, ms = DIM_WAIT_MS) {
  const b = button(text);
  if (waited.has(key)) return b;
  b.classList.add("submit-button--timed");
  const fill = el("span", "button-fill");
  b.appendChild(fill);
  b.disabled = !DEBUG;
  requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transitionDuration = `${ms}ms`; fill.style.width = "100%"; }));
  setTimeout(() => { waited.add(key); b.disabled = false; b.classList.remove("submit-button--timed"); fill.remove(); }, ms);
  return b;
}

function dimsNav(card, i) {
  const back = button("← Back", true);
  back.addEventListener("click", () => go(i === 0 ? "q1result" : `dims:${i - 1}`));
  const next = timedButton("Next →", `dims:${i}`);
  next.addEventListener("click", () => {
    if (i === DIMS_TOTAL - 1) { state.critters = Math.max(state.critters, 3); go("q2intro"); }
    else go(`dims:${i + 1}`);
  });
  card.appendChild(nav(back, next));
}

function renderDims(i) {
  if (i === 0) {
    return signpost({
      step: 3, frac: 0,
      text: `In the main task you will read a person’s situation as summarized by their AI assistant, then say how a ${SCHOOL.short} counselor would respond using eleven questions about the response.`,
      back: () => go("q1result"),
      next: () => go("dims:1"),
      withBee: false,
    });
  }
  if (i === 1) {
    return signpost({
      step: 3, frac: 1 / DIMS_TOTAL,
      text: `We will now tell you about the ${DIM_PAGES.length} strategies that you will use to label responses. We will quiz you on them later.`,
      back: () => go("dims:0"),
      next: () => go("dims:2"),
      withBee: false,
    });
  }
  screen({ step: 3, frac: i / DIMS_TOTAL });
  const card = el("section", "card survey-card");
  const page = DIM_PAGES[i - DIMS_FIRST_PAGE];
  card.appendChild(el("div", "card-eyebrow", `Strategy ${i - DIMS_FIRST_PAGE + 1} of ${DIM_PAGES.length}`));
  const body = el("div", "survey-card-body");
  if (page.kind === "tactic") {
    const t = page.tactic;
    body.appendChild(el("p", "dim-page-name", t.name));
    body.appendChild(el("p", "dim-page-def", t.def));
    body.appendChild(el("p", "dim-page-def", `Example: ${t.ex}`));
    body.appendChild(el("p", "survey-question-text", "You will be asked if a response should include this strategy."));
  } else {
    const s = page.stance;
    body.appendChild(el("p", "dim-page-name", s.name));
    body.appendChild(el("p", "dim-page-def", `About ${s.target}.`));
    body.appendChild(el("p", "survey-question-text", "You will be asked which of these stances a response should lead with."));
    const choices = el("ul", "dim-page-choices");
    for (const o of STANCE_OPTIONS) {
      const li = el("li");
      li.append(el("b", null, o.name), ": " + o.def.replace(/\[target\]/g, page.stance === STANCES[0] ? "action" : "framing"));
      choices.appendChild(li);
    }
    body.appendChild(choices);
  }
  card.appendChild(body);
  dimsNav(card, i);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Quiz 2 screens (items are rendered by renderQuizItem).

function renderQ2Intro() {
  signpost({
    step: 4, frac: 0,
    text: "We will now quiz you on how these principles relate to the strategies you just saw.",
    back: () => go(`dims:${DIMS_TOTAL - 1}`),
    next: () => go("q2:0"),
    nextLabel: "Begin →",
  });
}

function renderQ2Result() {
  const outcome = quizOutcome(state.q2, Q2_ITEMS, THRESHOLDS.quiz2Pass);
  if (outcome === "pass") state.critters = Math.max(state.critters, 4);
  resultScreen({
    step: 4, score: quizScore(state.q2, Q2_ITEMS), total: Q2_ITEMS.length, outcome,
    passLabel: "You know how the principles map onto the strategies. One worked example, and then the main task.",
    onPass: () => go("exintro"),
    onRetake: () => { state.q2.attempt = 2; go("q2:0"); },
    onExit: () => go("exit"),
  });
}

// ---------------------------------------------------------------------------
// Worked example: one vignette, one answer per strategy, then a critique.

const EXAMPLE_STRATEGIES = [...TACTICS.map((t) => ({ kind: "tactic", name: t.name, def: t.def })), ...STANCES.map((s) => ({ kind: "stance", name: s.name, def: `About ${s.target}.` }))];

function vignetteBox(v = EXAMPLE) {
  const box = el("div", "vignette");
  const sit = el("blockquote", "vignette-message");
  sit.append(el("span", "card-eyebrow", "The situation"), v.situation);
  box.appendChild(sit);
  return box;
}

function renderExampleIntro() {
  signpost({
    step: 5, frac: 0,
    text: `Finally, a worked example: You will read one person’s situation and, for each strategy, say what an ideal response should look like according to the principles of ${SCHOOL.short}. Then we will go over your answers.`,
    back: () => go("q2result"),
    next: () => go("exvignette"),
  });
}

// Microphone button with a "Click to listen" caption.
function speakControl(text) {
  const wrap = el("div", "speak-control");
  wrap.append(speakButton(text), el("span", "speak-caption", "Click to listen"));
  return wrap;
}
// Microphone button that reads `text` aloud with the browser's speech synthesis; click again to stop.
function speakButton(text) {
  const b = el("button", "speak-button");
  b.type = "button";
  b.title = "Listen to the situation";
  b.setAttribute("aria-label", "Listen to the situation");
  b.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z" fill="currentColor"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if (!("speechSynthesis" in window)) { b.hidden = true; return b; }
  let speaking = false;
  const stop = () => { window.speechSynthesis.cancel(); speaking = false; b.classList.remove("speak-button--on"); };
  b.addEventListener("click", () => {
    if (speaking) return stop();
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.onend = stop;
    u.onerror = () => { stop(); b.disabled = true; b.title = "Speech is not available in this browser"; b.setAttribute("aria-label", b.title); };
    speaking = true; b.classList.add("speak-button--on");
    window.speechSynthesis.speak(u);
  });
  return b;
}

function renderExampleVignette() {
  screen({ step: 5, frac: 0.1 });
  const card = el("section", "card survey-card");
  const head = el("div", "read-heading-row");
  head.append(el("p", "read-heading", "Read the following"), speakControl(EXAMPLE.situation));
  card.appendChild(head);
  const body = el("div", "survey-card-body");
  body.appendChild(vignetteBox());
  body.appendChild(el("p", "read-heading", `For each of the following strategies, identify what an ideal response should look like as implied by the principles of ${SCHOOL.short}.`));
  card.appendChild(body);
  const back = button("← Back", true); back.addEventListener("click", () => go("exintro"));
  const next = timedButton("Next →", "exvignette", READ_WAIT_MS); next.addEventListener("click", () => go("ex:0"));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function stanceDef(optName, stanceName) {
  const o = STANCE_OPTIONS.find((x) => x.name === optName);
  return o.def.replace(/\[target\]/g, stanceName === "Action stance" ? "action" : "framing");
}
// Small ⓘ icon; the description appears on hover or focus.
function infoTip(text) {
  const tip = el("span", "info-tip", "i");
  tip.tabIndex = 0;
  tip.setAttribute("role", "img");
  tip.setAttribute("aria-label", text);
  tip.dataset.tip = text;
  tip.addEventListener("click", (e) => e.preventDefault());
  return tip;
}

function exampleFeedback(st, yours) {
  const g = EXAMPLE.gold[st.name];
  const status = yours === g.answer ? "ok" : "bad";
  const note = status === "bad" && g.partial && g.partial[yours] ? g.partial[yours] : g.why;
  return { status, note };
}

function renderExampleItem(i) {
  const st = EXAMPLE_STRATEGIES[i];
  const last = i === EXAMPLE_STRATEGIES.length - 1;
  const onNext = () => { if (last) { state.critters = Math.max(state.critters, 5); go(DEBUG || ASSIGNED ? "mainintro" : "done"); } else go(`ex:${i + 1}`); };
  screen({ step: 5, frac: 0.1 + 0.8 * (i + 1) / (EXAMPLE_STRATEGIES.length + 1) });
  const card = el("section", "card survey-card");
  const split = el("div", "survey-card-body survey-card-body--split");
  split.appendChild(vignetteBox());
  const body = el("div", "survey-card-body split-question");
  split.appendChild(body);
  body.appendChild(el("p", "dim-page-name", `Strategy: ${st.name}`));
  body.appendChild(el("p", "dim-page-def", st.def));
  const stem = st.kind === "tactic" ? `Should an ideal ${SCHOOL.short} response include this strategy?` : `Which stance should an ideal ${SCHOOL.short} response lead with?`;
  body.appendChild(el("p", "survey-question-text", stem));
  const options = st.kind === "tactic" ? ["Yes", "No"] : STANCE_OPTIONS.map((o) => o.name);
  const choices = el("div", "control-choices");
  const inputs = [];
  let picked = null;
  for (const opt of options) {
    const label = el("label", "control-choice");
    const input = document.createElement("input");
    input.type = "radio"; input.name = "example"; input.value = opt;
    input.addEventListener("change", () => { picked = opt; check.disabled = false; });
    label.append(input, el("span", null, opt));
    if (st.kind === "stance") label.appendChild(infoTip(stanceDef(opt, st.name)));
    choices.appendChild(label);
    inputs.push({ label, input, opt });
  }
  body.appendChild(choices);
  const feedbackHolder = el("div");
  body.appendChild(feedbackHolder);
  card.appendChild(split);
  const check = button("Check answer");
  check.disabled = true;
  const next = button("Next →");
  next.hidden = true;

  function reveal(yours) {
    const gold = EXAMPLE.gold[st.name].answer;
    const { status, note } = exampleFeedback(st, yours);
    for (const { label, input, opt } of inputs) {
      input.disabled = true;
      label.classList.add("control-choice--locked");
      if (opt === gold) { label.classList.add("control-choice--correct"); label.insertBefore(el("span", "choice-tag", SCHOOL.short), label.querySelector(".info-tip")); }
      else if (opt === yours) { label.classList.add("control-choice--wrong"); label.insertBefore(el("span", "choice-tag", "your pick"), label.querySelector(".info-tip")); }
    }
    const row = el("div", "lucky-chat-row");
    row.appendChild(luckyBee("avatar"));
    const bubble = el("p", `lucky-chat-bubble ${status === "ok" ? "lucky-chat-bubble--ok" : "lucky-chat-bubble--bad"}`);
    bubble.append(el("b", null, status === "ok" ? "That’s right. " : "Not quite. "), note);
    row.appendChild(bubble);
    feedbackHolder.appendChild(row);
    check.hidden = true;
    next.hidden = false;
  }

  const prior = state.example[st.name];
  if (prior) { const hit = inputs.find((x) => x.opt === prior); if (hit) hit.input.checked = true; reveal(prior); }
  check.addEventListener("click", () => { if (!picked) return; state.example[st.name] = picked; reveal(picked); });
  next.addEventListener("click", onNext);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(i === 0 ? "exvignette" : `ex:${i - 1}`));
  const n = nav(back, el("span", "spacer"), check, next);
  if (DEBUG) { const skip = button("Skip (debug) →", true); skip.addEventListener("click", onNext); n.insertBefore(skip, check); }
  body.appendChild(n);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// Main task (debug-only for now): the worked-example screens, one vignette at a time, without feedback.
// Vignettes are sampled at random from the pool when the participant reaches the intro.

const MAIN_STEP = 6;
// A link page (training/<hash>/, built by build.py from assignments.json) defines ASSIGNMENT = {hash, group, ids}: the
// participant labels exactly those vignettes, in an order shuffled per participant. Without it (the school pages),
// MAIN_N vignettes are sampled uniformly from VIGNETTE_POOL and the main task is debug-only.
const ASSIGNED = typeof ASSIGNMENT !== "undefined";
const MAIN_N = ASSIGNED ? ASSIGNMENT.ids.length : 10;
const poolById = Object.fromEntries(VIGNETTE_POOL.map((v) => [v.id, v]));
function sampleMain() {
  const ids = ASSIGNED ? [...ASSIGNMENT.ids] : VIGNETTE_POOL.map((v) => v.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  state.mainIds = ids.slice(0, MAIN_N);
}
function mainVignettes() { if (!state.mainIds.length) sampleMain(); return state.mainIds.map((id) => poolById[id]); }
function mainFrac(vi, si) { return (vi + (si + 1) / (EXAMPLE_STRATEGIES.length + 1)) / MAIN_N; }

function renderMainIntro() {
  signpost({
    step: MAIN_STEP, frac: 0,
    text: `Now the main task. You will read ${MAIN_N} situations. For each one and each strategy, say what an ideal response should look like according to the principles of ${SCHOOL.short}. This time there is no feedback.`,
    back: () => go(`ex:${EXAMPLE_STRATEGIES.length - 1}`),
    next: () => go("mv:0"),
    nextLabel: "Begin →",
  });
}

function renderMainVignette(vi) {
  const v = mainVignettes()[vi];
  screen({ step: MAIN_STEP, frac: mainFrac(vi, -1) });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", `Situation ${vi + 1} of ${MAIN_N}`));
  const head = el("div", "read-heading-row");
  head.append(el("p", "read-heading", "Read the following"), speakControl(v.situation));
  card.appendChild(head);
  const body = el("div", "survey-card-body");
  body.appendChild(vignetteBox(v));
  body.appendChild(el("p", "read-heading", `For each of the following strategies, identify what an ideal response should look like as implied by the principles of ${SCHOOL.short}.`));
  card.appendChild(body);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(vi === 0 ? "mainintro" : `mi:${vi - 1}:${EXAMPLE_STRATEGIES.length - 1}`));
  const next = timedButton("Next →", `mv:${vi}`, READ_WAIT_MS);
  next.addEventListener("click", () => go(`mi:${vi}:0`));
  card.appendChild(nav(back, next));
  bodyEl.appendChild(card);
}

function renderMainItem(vi, si) {
  const v = mainVignettes()[vi];
  const st = EXAMPLE_STRATEGIES[si];
  const lastS = si === EXAMPLE_STRATEGIES.length - 1;
  const lastV = vi === MAIN_N - 1;
  const onNext = () => go(lastS ? (lastV ? "done" : `mv:${vi + 1}`) : `mi:${vi}:${si + 1}`);
  screen({ step: MAIN_STEP, frac: mainFrac(vi, si) });
  const card = el("section", "card survey-card");
  card.appendChild(el("div", "card-eyebrow", `Situation ${vi + 1} of ${MAIN_N}`));
  const split = el("div", "survey-card-body survey-card-body--split");
  split.appendChild(vignetteBox(v));
  const body = el("div", "survey-card-body split-question");
  split.appendChild(body);
  body.appendChild(el("p", "dim-page-name", `Strategy: ${st.name}`));
  body.appendChild(el("p", "dim-page-def", st.def));
  const stem = st.kind === "tactic" ? `Should an ideal ${SCHOOL.short} response include this strategy?` : `Which stance should an ideal ${SCHOOL.short} response lead with?`;
  body.appendChild(el("p", "survey-question-text", stem));
  const options = st.kind === "tactic" ? ["Yes", "No"] : STANCE_OPTIONS.map((o) => o.name);
  const choices = el("div", "control-choices");
  const answers = state.main[v.id] || (state.main[v.id] = {});
  let picked = answers[st.name] || null;
  for (const opt of options) {
    const label = el("label", "control-choice");
    const input = document.createElement("input");
    input.type = "radio"; input.name = "main"; input.value = opt;
    if (picked === opt) input.checked = true;
    input.addEventListener("change", () => { picked = opt; next.disabled = false; });
    label.append(input, el("span", null, opt));
    if (st.kind === "stance") label.appendChild(infoTip(stanceDef(opt, st.name)));
    choices.appendChild(label);
  }
  body.appendChild(choices);
  card.appendChild(split);
  const back = button("← Back", true);
  back.addEventListener("click", () => go(si === 0 ? `mv:${vi}` : `mi:${vi}:${si - 1}`));
  const next = button("Next →");
  next.disabled = !picked;
  next.addEventListener("click", () => { if (!picked) return; answers[st.name] = picked; save(); onNext(); });
  const n = nav(back, el("span", "spacer"), next);
  if (DEBUG) { const skip = button("Skip (debug) →", true); skip.addEventListener("click", onNext); n.insertBefore(skip, next); }
  body.appendChild(n);
  bodyEl.appendChild(card);
}

// ---------------------------------------------------------------------------
// End screens.

function exportText() {
  return JSON.stringify({ school: SCHOOL.key, assignment: ASSIGNED ? { hash: ASSIGNMENT.hash, group: ASSIGNMENT.group } : null, prolificId: state.prolificId, startedAt: state.startedAt, finishedAt: new Date().toISOString(),
    q1: state.q1, q2: state.q2, example: state.example, mainIds: state.mainIds, main: state.main }, null, 1);
}

function renderDone() {
  screen({ step: STEPS.length - 1, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee("party"));
  const didMain = Object.keys(state.main).length > 0;
  body.appendChild(el("p", "survey-signpost-text", didMain ? "All done. Thank you for taking part." : `Training complete. The main task comes next: you will read situations and say how a ${SCHOOL.short} counselor would respond.`));
  body.appendChild(el("p", "survey-signpost-sub", `Principles quiz: ${quizScore(state.q1, Q1_ITEMS)} of ${Q1_ITEMS.length}. Strategies quiz: ${quizScore(state.q2, Q2_ITEMS)} of ${Q2_ITEMS.length}.`));
  const ta = el("textarea", "export"); ta.readOnly = true; ta.value = exportText();
  body.appendChild(el("p", "survey-signpost-sub", "Preview build: the answers recorded during training, as they would be submitted."));
  body.appendChild(ta);
  card.appendChild(body);
  const next = button("Continue to the main task →"); next.disabled = true; next.title = "Not part of this preview";
  const reset = button("Start over", true); reset.addEventListener("click", resetAll);
  card.appendChild(nav(reset, next));
  bodyEl.appendChild(card);
}

function renderExit() {
  screen({ step: STEPS.length - 1, frac: 1 });
  const card = el("section", "card survey-card survey-card--signpost");
  const body = el("div", "survey-card-body");
  body.appendChild(luckyBee("sad"));
  body.appendChild(el("p", "survey-signpost-text", "Thank you for your time. The study ends here."));
  card.appendChild(body);
  const reset = button("Start over", true); reset.addEventListener("click", resetAll);
  card.appendChild(nav(reset));
  bodyEl.appendChild(card);
}

function resetAll() {
  state.critters = 0; state.q1 = { attempt: 1, answers: {} }; state.q2 = { attempt: 1, answers: {} }; state.example = {}; state.main = {}; state.mainIds = [];
  state.startedAt = new Date().toISOString();
  go("consent");
}

// ---------------------------------------------------------------------------
// Router.

function render() {
  const [kind, arg, arg2] = state.screen.split(":");
  const i = Number(arg);
  const j = Number(arg2);
  switch (kind) {
    case "consent": return renderConsent();
    case "welcome": return renderWelcome();
    case "apply": return renderApply();
    case "intro": return renderIntro();
    case "card": return renderCard(i);
    case "q1intro": return renderQ1Intro();
    case "q1": return renderQuizItem("q1", i);
    case "q1result": return renderQ1Result();
    case "dims": return renderDims(i);
    case "q2intro": return renderQ2Intro();
    case "q2": return renderQuizItem("q2", i);
    case "q2result": return renderQ2Result();
    case "exintro": return renderExampleIntro();
    case "exvignette": return renderExampleVignette();
    case "ex": return renderExampleItem(i);
    case "mainintro": return renderMainIntro();
    case "mv": return renderMainVignette(i);
    case "mi": return renderMainItem(i, j);
    case "done": return renderDone();
    case "exit": return renderExit();
    default: state.screen = "consent"; return renderConsent();
  }
}

render();

</script>
  </body>
</html>
